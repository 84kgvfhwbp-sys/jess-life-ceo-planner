<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jess's workspace for projects, daily admin and follow-ups.">
<title>Jess’s Workspace</title>
<style>
:root {
  color-scheme: light; --canvas:#f5f2ea; --paper:#fffdf8; --ink:#292e21; --muted:#625e51;
  --line:#e5dfd2; --olive:#39432b; --green:#e7ebdc; --burgundy:#703e4c;
  --rose:#f2e5e7; --gold:#f3e9d5; --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
* {box-sizing:border-box}
body {margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,textarea,select {font:inherit;color:inherit}
button {cursor:pointer}
button:disabled {cursor:default;opacity:.6}
a {color:#48573a;text-underline-offset:3px;overflow-wrap:anywhere}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {outline:2px solid #8a4d62;outline-offset:3px}
h1,h2,h3,p {margin:0}
h1,h2,h3 {overflow-wrap:anywhere}
h1,h2 {font:400 40px/1.08 var(--serif);letter-spacing:-.045em}
h2 {font-size:28px}
h3 {font-size:15px;line-height:1.35}
small,.muted {color:var(--muted)}
svg {display:inline-block;flex:none;vertical-align:middle}
[hidden] {display:none!important}
.shell {min-height:100vh;display:grid;grid-template-columns:219px minmax(0,1fr)}
aside {position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:27px 17px 19px;border-right:1px solid var(--line);background:#eeeade;gap:29px}
.brand {display:flex;gap:11px;align-items:center;text-align:left;background:none;border:0;padding:0 4px;color:var(--ink)}
.brand img {object-fit:cover;width:36px;height:39px;border-radius:19px 19px 4px 4px}
.brand strong {display:block;font:22px/1 var(--serif);letter-spacing:-.045em}
.brand small {font-size:11px}
.nav-label,.eyebrow {font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:760}
.nav-label {color:var(--muted);padding:0 10px 8px}
nav {display:grid;gap:3px}
.nav-button {width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:10px;border:0;border-radius:9px;background:none;color:#514e40;font-weight:590;white-space:nowrap}
.nav-button[aria-current=page] {background:#dce2ce;color:#313c24}
.nav-button:hover:not([aria-current]) {background:#e6e0d2}
.nav-count {margin-left:auto;background:var(--paper);border-radius:30px;padding:1px 7px;font-size:11px}
.aside-foot {margin-top:auto;display:grid;gap:8px}
.storage {display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;padding-left:9px}
.dot {display:inline-block;width:7px;height:7px;background:#64744d;border-radius:50%;flex:none}
.stage {min-width:0}
.topbar {background:#f5f2eaf2;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.top-inner {min-height:67px;max-width:1350px;margin:auto;padding:10px clamp(17px,3.35vw,48px);display:flex;align-items:center;gap:14px}
.search-trigger {display:flex;gap:8px;align-items:center;min-width:0;max-width:360px;flex:1;text-align:left}
.search-trigger span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-inner .spaces {margin-left:auto}
.spaces {display:flex;gap:2px;border-radius:9px;background:#ebe6da;padding:3px;flex:none}
.spaces button {background:none;border:0;padding:5px 10px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:650}
.spaces button[aria-pressed=true] {background:var(--paper);color:var(--ink);box-shadow:0 1px 4px #30281a12}
.btn {display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:650;white-space:nowrap;font-size:13px;min-height:36px}
.btn:hover {background:#f0ecdf}
.btn.primary {background:var(--olive);border-color:var(--olive);color:#fffdf5}
.btn.primary:hover {background:#4b573b}
.btn.quiet {background:none;border-color:transparent}
.btn.quiet:hover {background:#eee9dd}
.btn.icon {padding:7px;min-width:35px}
.btn.danger {color:#8a3848}
main {max-width:1350px;margin:auto;padding:24px clamp(17px,3.35vw,48px) 56px;display:grid;gap:22px}
.hero {min-height:208px;border-radius:17px;overflow:hidden;isolation:isolate;display:flex;align-items:center;position:relative;background:#38412c;color:#fffbed}
.hero::after {content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#39432d 0%,#39432d 38%,#39432d70 63%,#552f2014 100%)}
.hero-copy {padding:25px 32px;max-width:630px}
.hero h1 {font-size:clamp(42px,5vw,65px);margin:7px 0}
.hero .eyebrow,.hero p {color:#f1eddd}
.hero .btn {margin-top:17px;background:#f7f2e3;border-color:#f7f2e3}
.cards {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat {display:flex;align-items:center;gap:11px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat:hover {border-color:#a5aa90}
.tile-icon {height:36px;width:36px;flex:none;display:grid;place-items:center;background:var(--green);color:#45533a;border-radius:9px}
.tile-icon.rose {background:var(--rose);color:var(--burgundy)}
.tile-icon.gold {background:var(--gold);color:#745425}
.stat strong {font:26px/1 var(--serif);display:block}
.stat small {font-size:12px}
.stat .arrow {margin-left:auto;color:var(--muted)}
.columns {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.panel {background:var(--paper);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-head {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px}
.panel-head h2 {font-size:25px}
.panel-body {padding:0 18px 14px}
.row {display:flex;align-items:flex-start;gap:10px;min-width:0;padding:12px 0;border-top:1px solid var(--line)}
.row p,.row small {overflow-wrap:anywhere}
.row-main {flex:1;min-width:0}
.row-main .title {font-weight:700}
.row-main .title.link {background:none;padding:0;border:0;text-align:left;color:#34402b}
.row-main .title.link:hover {text-decoration:underline;text-underline-offset:3px}
.row-actions {display:flex;align-items:center;gap:3px;flex:none}
.entry .copy {white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.empty {padding:18px 0;color:var(--muted)}
.check {margin-top:3px;width:21px;height:21px;border:1px solid #b4b7a2;border-radius:6px;display:grid;place-items:center;background:#fffdf8;color:var(--olive);flex:none;padding:0}
.check.checked {background:var(--green);border-color:#9dab91}
.done .title {text-decoration:line-through;color:var(--muted)}
.badge {display:inline-block;font-size:11px;font-weight:700;color:#445039;background:var(--green);padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.rose {background:var(--rose);color:var(--burgundy)}
.badge.gold {background:var(--gold);color:#6d5029}
.badge.neutral {background:#eeeae0;color:#5b5548}
.heading {display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.heading h1 {font-size:clamp(40px,5vw,57px);margin:5px 0 8px}
.heading .meta {display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.record-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,228px),1fr));gap:13px}
.record {background:var(--paper);border:1px solid var(--line);border-radius:12px;text-align:left;padding:16px;display:grid;gap:9px;min-width:0}
.record:hover {border-color:#a5aa90}
.record h3 {font:23px/1.1 var(--serif);font-weight:400}
.record .meta {display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
progress {accent-color:#64774d;height:9px;width:100%}
.notes-form {display:grid;gap:8px;margin-bottom:15px}
textarea {resize:vertical;min-height:98px}
.notes-form .actions {display:flex;justify-content:space-between;align-items:center;gap:8px}
.field {display:grid;gap:5px;font-weight:650}
.field small {font-weight:400}
input,textarea,select {width:100%;border:1px solid #d8d1c1;border-radius:7px;background:#fffdf9;padding:8px 9px;font-weight:400;min-width:0}
.entry-img {display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin-top:8px}
.add-row {display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 13px}
.details-grid {display:grid;gap:9px}
details.panel {padding:0 18px}
details summary {padding:12px 0;cursor:pointer;font-weight:700}
dialog {width:min(500px,calc(100% - 28px));max-height:90dvh;border:1px solid var(--line);border-radius:15px;background:var(--paper);color:var(--ink);padding:0;box-shadow:0 20px 65px #29271e3d}
dialog::backdrop {background:#23251f75}
.dialog-head {padding:17px 20px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dialog-body {padding:0 20px 20px}
.dialog-body form {display:grid;gap:11px}
.form-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-actions {display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.form-actions .danger {margin-right:auto}
.feedback {margin:0;color:#84364c;min-height:1em;font-size:12px}
#toast {position:fixed;right:18px;bottom:18px;z-index:3;background:#343d2b;color:#fff8ed;padding:11px 15px;border-radius:9px;max-width:calc(100% - 36px);box-shadow:0 4px 14px #2223}
@media(max-width: 890px) {
  .shell {grid-template-columns:168px minmax(0,1fr)}
  aside {padding-inline:12px}
  .columns {grid-template-columns:1fr}
}
@media(max-width: 640px) {
  .shell {display:block}
  aside {height:auto;position:static;padding:12px 12px 7px;gap:9px;border-right:0;border-bottom:1px solid var(--line)}
  .brand img {width:27px;height:29px}
  .brand strong {font-size:20px}
  .brand small,.nav-label,.nav-count,.storage {display:none}
  .aside-foot {position:absolute;right:12px;top:7px}
  .aside-foot .nav-button {font-size:11px;padding:8px 5px}
  nav {grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
  .nav-button {font-size:12px;padding:6px;gap:5px;white-space:normal}
  .nav-button svg {width:14px;height:14px}
  .top-inner {min-height:54px;gap:6px;padding:7px 12px}
  .top-inner .spaces {margin-left:0}
  .spaces button {padding:4px 6px}
  .top-inner .btn {padding:6px 7px}
  input,textarea,select {font-size:16px}
  main {padding:14px 12px 30px;gap:13px}
  .hero {min-height:174px}
  .hero-copy {padding:18px}
  .hero::before {left:38%}
  .hero::after {background:linear-gradient(90deg,#39432d 0%,#39432d 39%,#39432d48 100%)}
  .cards {gap:5px}
  .stat {padding:6px;gap:5px}
  .stat .tile-icon {width:25px;height:28px}
  .stat .tile-icon svg {width:14px}
  .stat strong {font-size:23px}
  .stat small {font-size:10px;display:block}
  .stat .arrow {display:none}
  .panel-head,.panel-body,.add-row {padding-inline:13px}
}
:root {
  --canvas:#faf8f6;--paper:#fdfbf9;--ink:#282422;--muted:#6a5c54;
  --line:#e9e1db;--olive:#675046;--green:#e9e4dd;--burgundy:#795054;
  --rose:#f3e4e1;--gold:#f4ebe2;--serif:Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --workspace-sidebar:192px;--workspace-header:49px;
}
body {background:var(--canvas);color:var(--ink)}
.shell {display:grid;grid-template-columns:var(--workspace-sidebar) minmax(0,1fr);grid-template-rows:auto 1fr;max-width:1660px;margin:auto}
.notion-appbar {grid-column:1/-1;grid-row:1;position:sticky;top:0;z-index:5;min-height:var(--workspace-header);padding:6px 17px;display:flex;align-items:center;gap:10px;background:#f6f1ed;border-bottom:1px solid var(--line)}
.notion-brand {display:inline-flex;align-items:center;gap:8px;flex:none;background:none;border:0;font-weight:720;text-align:left;white-space:nowrap;padding:5px 7px}
.notion-brand svg {color:#9e7e63}
.notion-appbar .search-trigger {margin-left:auto;max-width:220px}
.notion-appbar .btn {font-size:12px;padding:5px 8px}
.notion-appbar .spaces {background:#eee6df;padding:2px}
.notion-appbar .spaces button {padding:4px 7px}
#notion-menu {display:none}
.notion-sidenav {grid-column:1;grid-row:2;position:static;height:auto;display:flex;gap:16px;padding:26px 13px 20px;background:#f8f3ef;border-right:1px solid var(--line)}
.notion-sidenav nav {display:block}
.notion-home-mark {margin:0 0 24px 11px;width:63px;height:52px;display:grid;place-items:center;background:#eee2d7;border:0;border-radius:13px;color:#a38368}
.notion-home-mark svg {width:31px;height:31px;stroke-width:1.5}
.notion-nav-group {margin-bottom:22px}
.notion-nav-label {min-height:26px;margin-bottom:4px;padding:4px 8px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:760;letter-spacing:.055em;text-transform:uppercase}
.notion-nav-label svg {width:15px;height:15px;color:#94765e}
.notion-sidenav .nav-button {font-size:12.5px;font-weight:480;padding:6px 7px;gap:8px;min-height:30px;white-space:normal;color:var(--ink);border-radius:6px}
.notion-sidenav .nav-button svg {width:15px;height:15px;color:#786c64}
.notion-sidenav .nav-button[aria-current=page] {background:#eee0da;color:#674847;font-weight:700}
.notion-sidenav .nav-button:hover:not([aria-current]) {background:#efe7e0}
.notion-sidebar-pages {margin:3px 0 5px 15px;padding:0 0 0 7px;border-left:1px solid #dacdc4;list-style:none}
.notion-sidebar-pages .ne-text-button {display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;text-align:left}
.notion-sidebar-quote {padding:13px 15px 15px;background:linear-gradient(150deg,#f0dfd8,#f7ece7);border-radius:8px;color:#56433a}
.notion-sidebar-quote span {display:block;color:#a98b74;font:43px/.9 var(--serif);height:32px}
.notion-sidebar-quote p {font:18px/1.33 var(--serif);margin:2px 0 13px}
.notion-sidebar-quote svg {color:#916f61}
.notion-sidenav .aside-foot {margin-top:0;position:static}
.notion-sidenav .aside-foot .nav-button {font-size:12px}
.notion-sidenav .storage {padding-left:7px;font-size:10px;line-height:1.35}
.notion-stage {grid-column:2;grid-row:2;min-width:0}
.notion-stage main {max-width:1220px;padding:22px clamp(18px,2.2vw,34px) 34px;gap:17px}
.notion-stage main.notion-today {padding-top:0}
.notion-stage .heading h1 {font:630 clamp(29px,4.5vw,43px)/1.13 var(--sans);letter-spacing:-.035em}
.notion-stage .panel-head h2,.dialog-head h2 {font:660 19px/1.25 var(--sans);letter-spacing:-.025em}
.notion-stage .record h3 {font:640 17px/1.25 var(--sans)}
.btn.primary {background:#725b50;border-color:#725b50;color:#fffaf5}
.btn.primary:hover {background:#59443c}
.nd-photo {display:block;background-size:cover;background-position:center;background-repeat:no-repeat}
@media(max-width:850px) {
  :root {--workspace-sidebar:153px}
  .notion-sidenav {padding-inline:10px}
  .notion-appbar {padding-inline:10px;gap:7px}
  .notion-stage main {padding-inline:15px}
}
@media(max-width:650px) {
  .shell {display:block}
  .notion-appbar {gap:4px;flex-wrap:wrap;padding:5px 9px 6px}
  .notion-brand {font-size:13px;gap:4px;padding:2px 3px}
  .notion-brand svg {width:14px;height:14px}
  #notion-menu {display:inline-flex;min-width:32px;padding:7px 4px}
  .notion-appbar #notion-page-plus span,.notion-appbar .search-trigger > span:last-child {display:none}
  .notion-appbar .search-trigger {flex:0;min-width:32px;min-height:33px}
  .notion-appbar .spaces {order:3;margin-inline:32px auto}
  .notion-appbar .btn {min-height:33px}
  .notion-sidenav {display:none;position:fixed;z-index:4;inset:var(--workspace-header) auto 0 0;width:min(290px,88vw);padding:30px 17px 20px;overflow-y:auto;box-shadow:10px 0 35px #48382b33}
  .notion-nav-open .notion-sidenav {display:flex}
  .notion-sidenav .aside-foot .storage {display:flex}
  .notion-stage main {padding-inline:12px}
}

.nd-dashboard,
.nd-calendar-page,
.nd-goals-page {
  --nd-ink: #262221;
  --nd-line: #e7dfd9;
  --nd-accent: #a68264;
  --nd-soft: #f5e7e3;
  --nd-panel: #fbf9f7;
  color: var(--nd-ink);
  min-width: 0;
}
.nd-dashboard {display: grid; gap: 18px; padding-bottom: 18px}
.nd-dashboard-content {display: grid; gap: 15px; min-width: 0}
.nd-hero {
  min-height: clamp(188px, 17.7vw, 234px);
  display: flex;
  align-items: center;
  position: relative;
  background: #f0ebe6;
  border-radius: 9px;
  overflow: hidden;
  isolation: isolate;
}
.nd-photo {display: block; background-repeat: no-repeat}
.nd-hero > .nd-photo {position: absolute; inset: 0 0 0 auto; width: min(59%, 680px); height: 100%; z-index: -2}
.nd-hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(90deg, #f4f0ec 5%, #f4f0ec 42%, #f4f0ecb5 48%, transparent 64%);
}
.nd-hero-copy {padding: 26px clamp(17px, 4vw, 39px); z-index: 1}
.nd-hero h1 {
  font-family: inherit;
  font-size: clamp(1.66rem, 2.5vw, 2.25rem);
  font-weight: 560;
  letter-spacing: -.045em;
  line-height: 1.17;
  margin: 0 0 16px;
}
.nd-hero h1 svg {color:#d69c92; display:inline-block; vertical-align:-3px; margin-left: 3px}
.nd-hero p {font-size: .82rem; margin: 0}
.nd-top-row,
.nd-bottom-row {display:grid; gap: 13px; min-width: 0; align-items: stretch}
.nd-top-row {grid-template-columns:minmax(0, .91fr) minmax(0, 1.09fr)}
.nd-bottom-row {grid-template-columns:minmax(0, 1.14fr) minmax(0, .86fr)}
.nd-panel {
  background: var(--nd-panel);
  min-width: 0;
  border: 1px solid var(--nd-line);
  border-radius: 10px;
  padding: 14px 16px 16px;
}
.nd-panel-title {
  border-bottom: 1px solid var(--nd-line);
  padding: 0 0 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 33px;
}
.nd-panel-title :is(h1,h2) {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  color: var(--nd-ink);
  font-family: inherit;
  font-weight: 700;
  letter-spacing: .012em;
  font-size: .81rem;
  line-height: 1.24;
  text-transform: uppercase;
}
.nd-panel-title :is(h1,h2) svg {color: var(--nd-accent); flex: 0 0 auto}
.nd-panel-title h1 {font-size: 1.25rem; text-transform: none; letter-spacing: -.015em}
.nd-button {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: 5px;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.nd-button:hover {background: #ede4de}
.nd-button:focus-visible,.nd-tick input:focus-visible + span {outline: 2px solid #946b54; outline-offset: 2px}
.nd-icon-button {width: 30px; height: 28px; flex: 0 0 auto}
.nd-clock {
  display: grid;
  place-items: center;
  position: relative;
  min-width: 0;
  width: min(100%, 304px);
  margin: 14px auto 12px;
  padding: 23px 29px;
  font-size: .68rem;
  white-space: nowrap;
}
.nd-clock > span {position: absolute}
.nd-clock-midnight {top: 0; left: 50%; transform: translateX(-50%)}
.nd-clock-noon {bottom: 2px; left: 50%; transform: translateX(-50%)}
.nd-clock-six {right: 0; top: 50%; transform: translateY(-50%)}
.nd-clock-evening {left: 0; top: 50%; transform: translateY(-50%)}
.nd-ring {
  border-radius: 50%;
  aspect-ratio: 1;
  width: 100%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--nd-events));
  position: relative;
}
.nd-ring::before {
  content: "";
  position: absolute;
  inset: 11.5%;
  background: var(--nd-panel);
  border-radius: inherit;
}
.nd-ring::after {
  content: "";
  position: absolute;
  width: 52%;
  aspect-ratio: 1;
  border: 1px solid transparent;
  border-top-color: #e3d8d1;
  border-radius: 50%;
  transform: translateY(-2%);
}
.nd-ring-face {z-index: 1; display: grid; text-align: center; gap: 5px}
.nd-ring-face strong {font-size: clamp(1.42rem, 2.5vw, 2.07rem); font-weight: 570; line-height: 1}
.nd-ring-face > span {font-size: .88rem}
.nd-schedule-agenda {padding: 1px 0}
.nd-event {
  width:100%; display:grid; grid-template-columns:14px minmax(0, 1fr) max-content;
  justify-items:start; gap:9px; text-align:left; padding:5px 4px; font-size:.72rem; min-height:27px;
}
.nd-event-dot {width: 12px; height: 12px; border-radius: 50%; background: var(--nd-dot)}
.nd-event time {text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.nd-event :nth-child(2) {overflow-wrap:anywhere}
.nd-calendar {display: flex; flex-direction: column}
.nd-month-toolbar {
  display:flex; align-items:center; justify-content:space-between; gap: 6px;
  padding: 13px 1px 7px; font-size: .82rem;
}
.nd-calendar-nav,
.nd-habit-controls {display:flex; align-items:center; gap:3px}
.nd-today {
  min-height: 30px;
  padding: 2px 10px;
  border: 1px solid #ddd1c9;
  font-size: .75rem;
}
.nd-month-grid {display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap: 2px 0; text-align:center; padding: 4px 0}
.nd-weekday {font-size:.73rem; padding: 6px 0; border-bottom: 1px solid #eee6df}
.nd-day {
  min-width: 0;
  min-height: 38px;
  width:100%;
  background:transparent;
  position:relative;
  font-size:.77rem;
  font-variant-numeric: tabular-nums;
}
.nd-day:hover {background:#f5ede8}
.nd-day-outside {color:#847870}
.nd-day span {
  width:30px; height:30px; display:grid; place-items:center; border-radius:50%; max-width:100%;
}
.nd-day[aria-pressed=true] span {background:#e8b0a8; color:#3b2622; font-weight:650}
.nd-day[aria-current=date]:not([aria-pressed=true]) span {border:1px solid var(--nd-accent)}
.nd-day-has-event::after {
  content:""; position:absolute; bottom:3px; width:4px; height:4px; background:#a97d67; border-radius:50%;
}
.nd-calendar-agenda {
  padding:4px 14px; margin-top:auto; background:var(--nd-soft); border-radius:8px; min-width:0;
}
.nd-month-grid + .nd-calendar-agenda {margin-block-start:auto}
.nd-calendar .nd-month-grid {margin-bottom: 11px}
.nd-calendar-agenda .nd-event {grid-template-columns:minmax(62px, .28fr) minmax(0, 1fr); min-height:35px; font-size:.77rem}
.nd-calendar-agenda .nd-event + .nd-event {border-top:1px solid #e8d6d1}
.nd-calendar-agenda .nd-task-due {border-top:1px solid #e8d6d1}
.nd-task-due > span:first-child {color:#785649}
.nd-more {font-size: .7rem; padding: 5px; margin: 2px 0; text-decoration: underline; text-underline-offset: 2px}
.nd-empty {font-size: .79rem; margin: 14px 2px; color: #74665f}
.nd-motivation-grid {display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap: 15px; margin-top: 12px}
.nd-motivation-card {overflow:hidden; border-radius:8px; background:#f3ebe5}
.nd-motivation-card > .nd-photo {width:100%; aspect-ratio:1.52}
.nd-motivation-copy {
  position:relative;
  min-height:80px;
  padding:10px 32px 13px 14px;
}
.nd-motivation-copy p {font-family: Georgia, serif; font-size: clamp(.89rem,1.6vw,1.08rem); line-height:1.23; margin:0}
.nd-motivation-copy .nd-favorite {position:absolute; right:6px; bottom:5px; color:#9b7860}
.nd-favorite[aria-pressed=true] svg {fill:#e1a69b; stroke:#a5675e}
.nd-habit-table {width:100%; table-layout:fixed; border-collapse:collapse; font-size:.76rem}
.nd-habit-table tr {border-bottom:1px solid #eee6e0}
.nd-habit-table tr:last-child {border-bottom:0}
.nd-habit-table :is(th, td) {padding:1px; font-weight:480; color:var(--nd-ink); text-align:center}
.nd-habit-table th:first-child {width:40%; padding: 0 4px; text-align:left}
.nd-habit-table thead th {padding-block: 5px}
.nd-habit-controls {gap:0}
.nd-habit-controls .nd-icon-button {width:25px}
.nd-habit-controls .nd-today {padding-inline:4px; white-space:nowrap}
.nd-edit-label {text-align:left; justify-content:flex-start; min-height:25px; padding: 3px 4px; overflow-wrap: anywhere}
.nd-tick {display:inline-grid; place-items:center; position:relative; width:24px; height:24px; cursor:pointer; vertical-align:middle}
.nd-tick input {
  position:absolute; inset:0; z-index:1; margin:0; opacity:0; width:100%; height:100%; cursor:pointer;
}
.nd-tick > span {
  position:relative; display:grid; place-items:center; width:15px; height:15px;
  border:1px solid #a7988d; border-radius:3px; background:#fcfaf8;
}
.nd-tick input:checked + span {background:#a8876d; border-color:#a8876d}
.nd-tick input:checked + span::after {
  content:""; width:7px; height:4px; border:solid #fff; border-width:0 0 1.5px 1.5px; transform:rotate(-45deg) translateY(-.5px);
}
.nd-goal-list {padding-top:10px; display:grid; gap:6px}
.nd-goal {display:flex; align-items:center; gap:7px; font-size:.81rem}
.nd-goal-done {text-decoration: line-through; color:#716359}
.nd-new-goal {width:100%; min-height:39px; margin:7px 0 0; background:var(--nd-soft); color:#654d42; font-size:.81rem; gap:3px}
.nd-footer {
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#e5d6ca;
  border-radius:8px;
  padding:3px 24px;
  overflow:hidden;
}
.nd-footer > svg {color:#ab886b; flex-shrink:0}
.nd-footer > svg:first-child {transform:rotate(11deg); opacity:.55; width:78px; height:76px}
.nd-footer > span {text-transform:uppercase; letter-spacing:.125em; font-size:.78rem; text-align:center}
.nd-footer b {font-weight:500; margin-inline:clamp(2px,1.35vw,18px)}
.nd-calendar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:5px 0 16px;
}
.nd-calendar-head h1 {font-family:inherit; font-weight:630; letter-spacing:-.035em; margin:0}
.nd-add-action {gap:5px; background:var(--nd-soft); min-height:39px; padding:6px 11px; white-space:nowrap}
.nd-goals-page {max-width:650px}
.nd-time-fields {display:grid; gap:9px; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.nd-visually-hidden {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
@media(max-width:1100px) {
  .nd-panel {padding-inline:12px}
  .nd-event {gap:6px}
}
@media(max-width:760px) {
  .nd-hero {min-height:153px}
  .nd-hero-copy {padding:17px}
  .nd-hero h1 {margin-bottom:10px}
  .nd-hero::before {background:linear-gradient(90deg,#f4f0ec 18%,#f4f0ecea 41%,#f4f0ec70 64%,transparent 82%)}
  .nd-top-row,.nd-bottom-row {grid-template-columns:minmax(0,1fr)}
  .nd-calendar-page .nd-calendar {grid-row:1}
  .nd-motivation-grid {gap:8px}
  .nd-motivation-copy {padding:8px 7px 29px; min-height:98px}
  .nd-motivation-copy .nd-favorite {bottom:3px; right:3px}
  .nd-footer {min-height:64px; padding:3px 11px}
  .nd-footer > svg:first-child {width:39px; height:47px}
  .nd-footer > svg:last-child {width:17px}
  .nd-footer > span {font-size:.61rem; letter-spacing:.08em}
}
@media(max-width:360px) {
  .nd-motivation-grid {grid-template-columns:minmax(0,1fr)}
  .nd-motivation-copy {min-height:0; padding:8px 27px 10px 8px}
  .nd-habit-table th:first-child {width:35%}
}

.n-db-panel {
  min-width: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 13px;
}
.n-db-controls,.n-db-cal-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.n-db-controls {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.n-db-views,.n-db-filters,.n-db-cal-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.n-db-views button {
  min-height: 37px;
  padding: 4px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
}
.n-db-views button:hover,.n-db-views button[aria-pressed=true] {
  background: #ece4d9;
  color: #33291f;
}
.n-db-filters {
  gap: 10px;
}
.n-db-filters label {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 12px;
}
.n-db-filters select {
  width: auto;
  min-height: 33px;
  padding: 4px 6px;
  background: transparent;
}
.n-db-table-wrap {
  overflow: auto;
  border-radius: 0 0 13px 13px;
}
.n-db-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.n-db-table th,.n-db-table td {
  min-width: 90px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--line);
}
.n-db-table th:first-child {
  min-width: 170px;
}
.n-db-table thead th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.n-db-table tbody tr:last-child > * {
  border-bottom: 0;
}
.n-db-table tbody tr:hover {
  background: #f8f4ed;
}
.n-db-status {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 6px;
  background: #f0ebdf;
  color: #504533;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 620;
}
.n-db-status.working {
  background: #f0e1dc;
  color: #633c36;
}
.n-db-status.waiting {
  background: #f3e8d3;
  color: #614927;
}
.n-db-status.complete {
  background: #e8eddc;
  color: #3f4e31;
}
.n-db-progress {
  display: flex;
  align-items: center;
  gap: 6px;
}
.n-db-progress progress {
  width: 78px;
  max-width: 60%;
  margin: 0;
}
.n-db-list,.n-db-lane ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.n-db-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.n-db-list li:last-child {
  border-bottom: 0;
}
.n-db-board {
  display: grid;
  grid-auto-columns: minmax(150px,1fr);
  grid-auto-flow: column;
  gap: 10px;
  overflow: auto;
  padding: 12px;
}
.n-db-lane {
  min-width: 0;
  padding: 9px;
  background: #f7f2eb;
  border-radius: 9px;
}
.n-db-lane h2 {
  margin-bottom: 10px;
  font: 600 13px/1.4 var(--sans);
}
.n-db-lane h2 > span:last-child,.n-db-lane > p {
  color: var(--muted);
  font-size: 12px;
}
.n-db-lane li {
  margin-top: 7px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
}
.n-db-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}
.n-db-meta > * + *::before {
  content: '·';
  margin-right: 6px;
}
.n-db-panel > .empty,.n-db-calendar,.n-task-page {
  padding: 14px 16px;
}
.n-db-cal-heading h2,.n-task-page h2 {
  font: 650 15px/1.35 var(--sans);
}
.n-db-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  margin-block: 9px 16px;
  gap: 2px;
}
.n-db-weekday {
  text-align: center;
  color: var(--muted);
  padding-block: 4px;
  font-size: 12px;
}
.n-db-date {
  position: relative;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  text-align: center;
  padding: 4px 2px;
}
.n-db-date.outside {
  color: var(--muted);
  background: #f8f5ee;
}
.n-db-date[aria-pressed=true] {
  border-color: #c59489;
  background: #f0ded7;
  color: #442b28;
  font-weight: 690;
}
.n-db-cal-count {
  display: inline-block;
  min-width: 17px;
  margin-left: 4px;
  padding-inline: 3px;
  color: #5e3e36;
  background: #eee1da;
  border-radius: 6px;
  font-size: 10px;
}
.n-db-cal-details > button {
  margin-top: 6px;
}
.n-db-properties {
  display: grid;
  gap: 7px;
  margin: 0 0 8px;
}
.n-db-properties > div {
  display: grid;
  grid-template-columns: 90px minmax(0,1fr);
  align-items: center;
  gap: 8px;
}
.n-db-properties dt {
  color: var(--muted);
}
.n-db-properties dd {
  margin: 0;
}
.n-task-body {
  margin-top: 8px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.ne-edit-page {
  width: min(100%, 780px);
  margin-inline: auto;
  padding: clamp(12px, 3vw, 36px) 0 40px;
}
.ne-section-head, .ne-crumbs, .ne-add, .ne-page-list li, .ne-block-content {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ne-section-head { justify-content: space-between; margin-bottom: 27px; }
.ne-section-head h1 { margin: 0; }
.ne-crumbs {
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-bottom: 20px;
  color: var(--muted);
  font-size: 13px;
}
.ne-crumb-divider { opacity: .6; }
.ne-text-button {
  display: inline;
  padding: 2px 3px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  text-align: start;
  overflow-wrap: anywhere;
}
.ne-text-button:hover { background: var(--line); }
.ne-crumbs .title { font-family: inherit; font-size: inherit; }
.ne-title-heading { margin: 0; min-width: 0; }
.ne-page-title {
  display: block;
  width: 100%;
  padding: 5px 2px;
  margin: 0 0 12px;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: var(--ink);
  font: inherit;
}
.ne-editor { margin-top: 9px; min-width: 0; }
.ne-block {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 4px;
  position: relative;
  min-height: 36px;
  margin: 2px 0;
  border-radius: 5px;
}
.ne-block-toolbar {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  opacity: .16;
  transition: opacity .12s ease;
}
.ne-block:hover .ne-block-toolbar, .ne-block:focus-within .ne-block-toolbar { opacity: 1; }
.ne-block-control {
  width: 30px;
  min-width: 30px;
  height: 36px;
  border: 0;
  border-radius: 4px;
  padding: 0;
  background: transparent;
  color: var(--muted);
  font: 600 17px/1 var(--sans);
}
.ne-block-control:not(:disabled):hover { background: var(--line); color: var(--ink); }
.ne-block-control:disabled { opacity: .3; }
.ne-block-content {
  grid-column: 1;
  grid-row: 1;
  min-height: 36px;
  padding-inline: 2px;
}
.ne-block-text {
  display: block;
  min-width: 0;
  width: 100%;
  margin: 0;
  padding: 7px 4px;
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--ink);
  background: transparent;
  font: inherit;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.ne-block-text::placeholder, .ne-page-title::placeholder { color: var(--muted); opacity: .67; }
.ne-block-text:hover { border-color: var(--line); }
.ne-block-text:focus { outline: none; border-color: var(--line); background: var(--paper); }
.ne-block textarea { field-sizing: content; min-height: 35px; max-height: 65vh; resize: vertical; }
.ne-block input.ne-block-text { resize: none; }
.ne-heading { margin-top: 12px; }
.ne-heading .ne-block-text { font-size: clamp(21px, 3vw, 28px); font-weight: 650; line-height: 1.26; }
.ne-subheading .ne-block-text { font-size: 19px; font-weight: 650; line-height: 1.32; }
.ne-quote .ne-block-content { border-inline-start: 3px solid var(--muted); padding-inline-start: 10px; }
.ne-quote .ne-block-text { font-family: var(--serif); font-size: 18px; }
.ne-callout .ne-block-content { background: var(--gold); border-radius: 6px; padding-inline: 12px 6px; }
.ne-callout-dot { color: var(--burgundy); font-size: 22px; }
.ne-bullet { margin-inline: 8px 2px; }
.ne-check { width: 17px; height: 17px; margin: 0 0 0 4px; accent-color: var(--olive); flex: none; }
.ne-complete .ne-block-text { text-decoration: line-through; color: var(--muted); }
.ne-link .ne-block-content { flex-wrap: wrap; column-gap: 8px; row-gap: 0; }
.ne-link .ne-block-text { flex: 1 1 128px; }
.ne-block-link { color: var(--burgundy); margin-inline: 3px 6px; font-size: 13px; }
.ne-divider hr { width: 100%; margin: 0; border: 0; border-top: 1px solid var(--line); }
.ne-add { margin-top: 10px; flex-wrap: wrap; }
.ne-add-tip { font-size: 12px; }
.ne-save-status:not(:empty) { display: block; margin: 0 0 5px; color: var(--burgundy); }
.ne-command-menu {
  position: relative;
  display: grid;
  width: min(100%, 245px);
  gap: 3px;
  margin: 3px 0 12px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  box-shadow: 0 8px 24px #241b1414;
}
.ne-command-menu button {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 7px;
  min-height: 35px;
  color: var(--ink);
  border: 0;
  border-radius: 4px;
  background: transparent;
  text-align: start;
}
.ne-command-menu button span {
  display: grid;
  width: 26px;
  height: 24px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--muted);
  font-size: 12px;
}
.ne-command-menu button:hover, .ne-command-menu button.ne-command-active { background: var(--rose); }
.ne-command-menu p { margin: 6px; font-size: 13px; }
.ne-subpages { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 12px; }
.ne-page-list { display: grid; gap: 3px; list-style: none; margin: 0 0 7px; padding: 0; }
.ne-page-list li { min-height: 38px; color: var(--muted); padding: 5px 7px; border-radius: 5px; }
.ne-page-list li:hover { background: var(--paper); }
.ne-page-list li > span { display: grid; place-items: center; }
.ne-page-list button { color: var(--ink); font-weight: 600; }
.ne-record-blocks {
  margin: 20px 0;
  padding: clamp(14px, 3vw, 26px);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
}
.ne-record-blocks h2 { margin: 0 0 7px; }
@media (hover: none) {
  .ne-block-toolbar { opacity: .65; }
  .ne-block-control { width: 34px; min-width: 34px; }
}
@media (max-width: 520px) {
  .ne-block-toolbar { gap: 0; }
  .ne-block-control { width: 28px; min-width: 28px; height: 40px; }
  .ne-page-title { font-size: 31px; }
  .ne-section-head { gap: 9px; }

const draftLimit = 20000;
function validDrafts(drafts) {
  if (drafts === undefined) return true;
  const draftText = value => typeof value==='string'&&value.length<=draftLimit;
  if (!drafts || typeof drafts!=='object' || Array.isArray(drafts)) return false;
  const {notes,capture} = drafts;
  if (notes!==undefined && (!notes || typeof notes!=='object' || Array.isArray(notes) || !Object.values(notes).every(draftText))) return false;
  return capture===undefined || (capture && draftText(capture.body) && sources.includes(capture.source) && groups.includes(capture.space));
}
const isoDate = value => typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(new Date(value+'T12:00:00Z').getTime());
function validData(value) {
  if (!value || !notionExtensionValid(value) || !validDrafts(value.drafts) || !collections.every(key=>{
    const list=value[key];
    return Array.isArray(list)&&list.every(item=>item&&typeof item.id==='string')&&new Set(list.map(item=>item.id)).size===list.length;
  })) return false;
  return value.records.every(item=>['Projects','Employees','Clients'].includes(item.type)&&groups.includes(item.space)&&typeof item.title==='string'&&
    (item.type!=='Projects'||(statuses.includes(item.status)&&Number.isInteger(item.progress)&&item.progress>=0&&item.progress<=100)))&&
    value.entries.every(item=>['Note','Link','Photo','Reminder','Update'].includes(item.kind)&&typeof item.record==='string'&&
      (!item.due||isoDate(item.due))&&(item.kind!=='Reminder'||isoDate(item.due)))&&
    value.inbox.every(item=>typeof item.body==='string'&&groups.includes(item.space))&&
    value.admin.every(item=>typeof item.title==='string'&&groups.includes(item.space)&&['Daily','Weekly'].includes(item.repeat)&&
      Array.isArray(item.checks)&&item.checks.every(isoDate));
}

function latestData() {
  const raw=localStorage.getItem(key);
  if (!raw) {
    if (blockedStorage) throw new Error('Saved data is unavailable.');
    return data;
  }
  const stored=JSON.parse(raw);
  if (!validData(stored)) throw new Error('Saved data could not be read.');
  return stored;
}
function save(change,message,{draft=false,snapshot=null}={}) {
  try {
    const updated=snapshot || (draft?latestData():structuredClone(latestData()));
    if (!snapshot) change(updated);
    localStorage.setItem(key,JSON.stringify(updated));
    data=updated;
    blockedStorage=false;
    storageStatus='Saved in this browser';
  } catch (failure) {
    const error=failure?.name==='SecurityError'
      ? 'This preview blocks browser storage. Download the HTML file and open it in Chrome or Safari to save edits.'
      : 'Your change couldn’t be saved. Keep this tab open and check browser storage.';
    if (dialog.open) dialogBody.querySelector('.feedback')?.replaceChildren(error);
    if (!draft) note(error);
    return false;
  }
  if (!draft) render();
  if (message) note(message);
  return true;
}

function period(task,today=day()) {

}

async function resizePhoto(file) {
  if (file.size>25*1024*1024) throw new Error('Choose a photo smaller than 25 MB.');
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const ratio = Math.min(1,1400/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
    const context=canvas.getContext('2d');
    context.fillStyle='#ffffff';
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.76);
  } catch {
    throw new Error('This photo couldn’t be opened. Try a JPG, PNG, or WebP image.');
  } finally { URL.revokeObjectURL(url); }
}
function writeItem(items,item) {

async function submit(formElement,trigger) {
  if (!formElement?.reportValidity() || formElement.dataset.saving) return;
  const values = new FormData(formElement);
  const str = name => String(values.get(name)??'').trim();
  const kind = formElement.dataset.form;
  const id = formElement.dataset.id;
  const editingId = id || uid();
  const body = str('body');
  const title = str('title');
  let photo;
  const error = message => {
    if (dialog.open) dialogBody.querySelector('.feedback')?.replaceChildren(message);
    else note(message);
  };
  const blank = Array.from(formElement.querySelectorAll('input[type=text][required],textarea[required]')).some(input=>!input.value.trim());
  if (blank) { error('Fill in the required text before saving.'); return; }
  if (kind==='quick-note') {
    if (!rec(id)) { error('This record is no longer available. Copy your note before leaving.'); return; }
    const saved=save(d=>{
      d.entries.unshift({id:uid(),record:id,kind:'Note',source:'Note',body,created:day()});
      if (d.drafts?.notes) delete d.drafts.notes[id];
    },'Note saved.');
    if (saved) main.querySelector('.notes-form textarea')?.focus();
    return;
  }
  if (kind==='entry' && str('kind')==='Link' && !allowedLink(str('url'))) {
    error('Enter a link beginning with https:// or http://.');
    return;
  }
  if (kind==='entry' && values.get('photo')?.size) {

function applyBackup(merge) {
  if (!pendingRestore) return;
  const saved=merge ? save(d=>{
    for (const name of collections) {
      const positions=new Map(d[name].map((item,index)=>[item.id,index]));
      for (const item of pendingRestore[name]) {
        const existing=positions.get(item.id);
        if (existing===undefined) d[name].push(item);
        else if (d[name][existing].sample && !item.sample) d[name][existing]=item;
      }
    }
    notionMergeBackup(d,pendingRestore);
    const imported=pendingRestore.drafts;
    if (!imported) return;
    d.drafts ??= {};
    d.drafts.notes={...imported.notes,...d.drafts.notes};
    if (imported.capture && !d.drafts.capture?.body) d.drafts.capture=imported.capture;
  },'Backup items added.') : save(null,'Workspace restored.',{snapshot:pendingRestore});

    dialog.close();
    if (!merge) {

      go('Today');

  }

function notionEditorValid(pages) {
  if (pages === undefined) return true;
  if (!Array.isArray(pages)) return false;
  const validText = (value, limit) => typeof value === 'string' && value.length <= limit;
  const isId = value => validText(value, 200) && value.length > 0;
  const knownType = /^(text|heading|subheading|todo|bullet|quote|callout|link|divider)$/;
  if (!pages.every(page => page && isId(page.id) && isId(page.parent) &&
    validText(page.title, 180) && Array.isArray(page.blocks) &&
    page.blocks.every(block => block && isId(block.id) && typeof block.type === 'string' &&
      knownType.test(block.type) && validText(block.text, 20000) &&
      (block.checked === undefined || typeof block.checked === 'boolean')) &&
    new Set(page.blocks.map(block => block.id)).size === page.blocks.length)) return false;
  return new Set(pages.map(page => page.id)).size === pages.length;
}

function notionPageById(id, workspace = data) {

function notionBreadcrumb(page) {
  const crumbs = [];
  const visited = new Set([page.id]);
  let parent = page.parent;
  while (!visited.has(parent)) {
    visited.add(parent);
    if (parent.startsWith('section:')) {
      const name = parent.slice('section:'.length);
      crumbs.unshift('<button class="ne-text-button" type="button" data-view="' + esc(name) + '">' +
        esc(name) + '</button>');
      break;
    }
    if (parent.startsWith('record:')) {
      const record = rec(parent.slice('record:'.length));
      if (record) crumbs.unshift(openRecord(record.id,record.title));
      break;
    }
    const ancestor = notionPageById(parent);
    if (!ancestor) break;
    crumbs.unshift(notionOpenPageMarkup(ancestor));
    parent = ancestor.parent;
  }
  return '<nav class="ne-crumbs" aria-label="Page path"><button class="ne-text-button" type="button" ' +
    'data-view="Today">Workspace</button>' + crumbs.map(crumb =>
    '<span class="ne-crumb-divider" aria-hidden="true">/</span>' + crumb).join('') + '</nav>';
}

function notionPageSearch(matches) {
  return (data.notionPages || []).flatMap(page => {
    const record = page.parent.startsWith('record:') ? rec(page.parent.slice('record:'.length)) : null;
    const title = record ? record.title : notionPageName(page);
    const matchingBlock = page.blocks.find(block => matches(block.text));
    if ((!matchingBlock && !matches(title)) || (page.parent.startsWith('record:') && !record)) return [];
    const open = record ? openRecord(record.id,title) : notionOpenPageMarkup(page,title);
    return ['<div class="row"><div class="row-main">' + open +
      (matchingBlock ? '<p>' + esc(matchingBlock.text.slice(0,155)) + '</p>' : '') +
      '<small>Page</small></div></div>'];
  });
}

function notionCreatePage(trigger, parent = 'section:Notes') {
  modal(notionPageById(parent) ? 'New subpage' : 'New page',
    '<form data-ne-create="' + esc(parent) + '">' +
    field('Title','pageTitle','',{required:true,attrs:'maxlength="180"'}) +
    select('Start from','template',[['blank','Blank page'],['meeting','Meeting notes'],['weekly','Weekly review'],['project','Project brief']],'blank') +
    '<p class="feedback" role="alert"></p><div class="form-actions">' +
    btn('Cancel','close',{style:'quiet'}) + '<button class="btn primary" type="submit">Create page</button></div></form>',trigger);
}

let notionOpenCommand = null;

function notionCloseCommand() {
  if (!notionOpenCommand) return;
  notionOpenCommand.menu.remove();
  notionOpenCommand.trigger.removeAttribute('aria-controls');
  notionOpenCommand.trigger.removeAttribute('aria-expanded');
  notionOpenCommand = null;
}

function notionCommandChoices(command, query = '') {
  const search = query.trim().toLowerCase();
  const choices = Object.entries(notionBlockTypes).filter(([id,type]) =>
    (id + ' ' + type.label + ' ' + type.aliases).toLowerCase().includes(search));
  command.menu.innerHTML = choices.length ? choices.map(([id,type]) =>
    '<button type="button" data-n-edit="choose-block" data-ne-kind="' + id + '"><span aria-hidden="true">' +
    type.glyph + '</span>' + type.label + '</button>').join('') :
    '<p class="muted">No matching block types</p>';
  command.selected = -1;
}

function notionShowCommand(trigger, block, replace, query = '') {
  if (notionOpenCommand?.trigger === trigger && notionOpenCommand.menu.isConnected) {
    if (replace) notionCommandChoices(notionOpenCommand,query);
    else notionCloseCommand();
    return;
  }
  notionCloseCommand();
  const editor = trigger.closest('[data-ne-editor]');
  if (!editor) return;
  const menu = document.createElement('div');
  menu.id = 'ne-block-choices';
  menu.className = 'ne-command-menu';
  menu.setAttribute('role','group');
  menu.setAttribute('aria-label','Block types');
  const host = block || trigger.closest('.ne-add');
  host.insertAdjacentElement('afterend',menu);
  trigger.setAttribute('aria-controls',menu.id);
  trigger.setAttribute('aria-expanded','true');
  notionOpenCommand = {menu,trigger,pageId:editor.dataset.neEditor,blockId:block?.dataset.neBlock,replace,selected:-1};
  notionCommandChoices(notionOpenCommand,query);
  if (!replace) menu.querySelector('button')?.focus();
}

function notionFocusBlock(pageId, blockId) {
  const block = main.querySelector('[data-ne-editor="' + CSS.escape(pageId) + '"] [data-ne-block="' +
    CSS.escape(blockId) + '"]');
  (block?.querySelector('[data-ne-field="text"]') || block?.querySelector('button'))?.focus();
}

function notionEditCommand(kind) {
  if (!notionOpenCommand || !Object.hasOwn(notionBlockTypes,kind)) return;
  const {pageId,blockId,replace} = notionOpenCommand;
  const block = notionMakeBlock(kind);
  if (save(workspace=>{
    const page = notionPageById(pageId,workspace);
    if (!page) return;
    const index = page.blocks.findIndex(item=>item.id===blockId);
    if (index<0) page.blocks.push(block);
    else if (replace) page.blocks.splice(index,1,block);
    else page.blocks.splice(index+1,0,block);
  },'')) {
    notionCloseCommand();
    notionFocusBlock(pageId,block.id);
  }
}

function notionSaveEditorValue(input) {
  const pageId = input.dataset.neTitle || input.closest('[data-ne-editor]')?.dataset.neEditor;
  const blockId = input.closest('[data-ne-block]')?.dataset.neBlock;
  const status = input.closest('[data-ne-editor]')?.querySelector('[data-ne-save-status]') ||
    input.closest('.ne-edit-page')?.querySelector('[data-ne-save-status]');
  const saved = save(workspace=>{
    const page = notionPageById(pageId,workspace);
    if (!page) throw new Error('This page could not be found.');
    if (input.dataset.neTitle) {
      page.title = input.value;
      return;
    }
    const block = page.blocks.find(item=>item.id===blockId);
    if (!block) throw new Error('This block could not be found.');
    if (input.dataset.neField==='checked') block.checked=input.checked;
    else block.text=input.value;
  },'',{draft:true});
  if (status) {
    status.textContent = saved ? '' : 'Changes couldn’t be saved in this browser.';
  }
  if (input.type==='checkbox') {
    input.closest('.ne-block').classList.toggle('ne-complete', input.checked);
  } else if (input.type==='url') {
    const link = input.nextElementSibling;
    const url = allowedLink(input.value);
    if (url) link.href = url;
    else link.removeAttribute('href');
    link.hidden = !url;
  }
}

document.addEventListener('submit',event=>{
  const form = event.target.closest('form[data-ne-create]');
  if (!form) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if (!form.reportValidity()) return;
  const title = form.elements.pageTitle.value.trim();
  if (!title) {
    form.querySelector('.feedback').textContent = 'Enter a title for this page.';
    form.elements.pageTitle.focus();
    return;
  }
  const page = {id:uid(),parent:form.dataset.neCreate,title,blocks:notionTemplateBlocks(form.elements.template.value)};
  if (save(workspace => { (workspace.notionPages ??= []).push(page); },'Page created.')) {
    dialog.close();
    go('Page',page.id);
    notionFocusBlock(page.id,page.blocks[0].id);
  }
},true);

main.addEventListener('input',event=>{
  const input = event.target;
  if (input.matches('[data-ne-title],[data-ne-field="text"]')) notionSaveEditorValue(input);
  if (!input.matches('textarea[data-ne-field="text"]')) return;
  const command = /^\/([\p{L}\d -]{0,28})$/u.exec(input.value);
  if (command) notionShowCommand(input,input.closest('[data-ne-block]'),true,command[1]);
  else if (notionOpenCommand?.trigger === input) notionCloseCommand();
});

main.addEventListener('change',event=>{
  if (event.target.matches('[data-ne-field="checked"]')) notionSaveEditorValue(event.target);
});

document.addEventListener('click',event=>{
  const button = event.target.closest('button[data-n-edit]');
  if (!button) {
    if (notionOpenCommand && !notionOpenCommand.menu.contains(event.target) &&
      event.target !== notionOpenCommand.trigger) notionCloseCommand();
    return;
  }
  const action = button.dataset.nEdit;
  const row = button.closest('[data-ne-block]');
  const editor = button.closest('[data-ne-editor]');
  if (action === 'new-page') {
    notionCloseCommand();
    notionCreatePage(button,button.dataset.neParent);
    return;
  }
  if (action === 'open-page') {
    notionCloseCommand();
    const page = notionPageById(button.dataset.nePage);
    if (!page) return;
    if (dialog.open) dialog.close();
    go('Page',page.id);
    main.querySelector('.ne-page-title')?.focus({preventScroll:true});
    return;
  }
  if (action === 'start-record') {
    const record=rec(button.dataset.neRecord);
    if (!record) return;
    const page={id:uid(),parent:'record:'+record.id,title:record.title.slice(0,180),blocks:notionTemplateBlocks('blank')};
    if (save(workspace=>{
      const pages = workspace.notionPages ??= [];
      if (!pages.some(item=>item.parent===page.parent)) pages.push(page);
    },'Page blocks added.')) {
      notionFocusBlock(page.id,page.blocks[0].id);
    }
    return;
  }
  if (action === 'choose-block') {
    notionEditCommand(button.dataset.neKind);
    return;
  }
  if (action === 'insert-block') {
    notionShowCommand(button,row,false);
    return;
  }
  const pageId = editor?.dataset.neEditor;
  const blockId = row?.dataset.neBlock;
  if (!pageId || !blockId) return;
  if (!['move-up','move-down','remove-block'].includes(action)) return;
  notionCloseCommand();
  if (save(workspace=>{
    const page = notionPageById(pageId,workspace);
    const blocks = page?.blocks;
    const index = blocks?.findIndex(block=>block.id===blockId);
    if (index===undefined || index<0) return;
    if (action==='remove-block') {
      blocks.splice(index,1);
      if (!blocks.length) blocks.push(notionMakeBlock('text'));
    } else {
      const next = index + (action==='move-up' ? -1 : 1);
      if (next>=0 && next<blocks.length) [blocks[index],blocks[next]]=[blocks[next],blocks[index]];
    }
  },action==='remove-block' ? 'Block deleted.' : '')) {
    if (action==='remove-block') main.querySelector('[data-ne-editor="' + CSS.escape(pageId) + '"] .ne-add button')?.focus();
    else notionFocusBlock(pageId,blockId);
  }
});

document.addEventListener('keydown',event=>{
  if (event.isComposing) return;
  const add = event.target.closest('form[data-ne-create]');
  if (add && event.target.matches('input') && event.key==='Enter') {
    event.preventDefault();
    event.stopImmediatePropagation();
    add.requestSubmit();
    return;
  }
  const active = notionOpenCommand;
  if (!active?.menu.isConnected || (event.target !== active.trigger && !active.menu.contains(event.target))) return;
  if (event.key==='Escape') {
    event.preventDefault();
    active.trigger.focus();
    notionCloseCommand();
    return;
  }
  if (event.key==='Tab') {
    if (active.replace) notionCloseCommand();
    return;
  }
  const options = [...active.menu.querySelectorAll('button')];
  if (!options.length) return;
  if (event.key==='ArrowDown' || event.key==='ArrowUp') {
    event.preventDefault();
    active.selected = active.selected===-1
      ? (event.key==='ArrowDown' ? 0 : options.length-1)
      : (active.selected+options.length+(event.key==='ArrowDown' ? 1 : -1))%options.length;
    options.forEach((option,index)=>option.classList.toggle('ne-command-active',index===active.selected));
    if (!active.replace) options[active.selected].focus();
  } else if (event.key==='Enter' && event.target===active.trigger && active.replace) {
    event.preventDefault();
    notionEditCommand(options[Math.max(active.selected,0)].dataset.neKind);
  }
},true);

const notionTaskStatuses = ['To do', 'In progress', 'Completed'];
const notionDbViews = {
  Tasks: ['Table', 'Board', 'Calendar', 'List'],
  Projects: ['Table', 'Board', 'List']
};
const notionDbState = {
  Tasks: {layout: 'Table', filter: '', sort: 'created'},
  Projects: {layout: 'Table', filter: '', sort: 'created'}
};
let notionTaskCalendarDay = day();
let notionTaskCalendarMonth = notionTaskCalendarDay.slice(0, 7);

function notionDbButton(label, action, id = '', style = '', ariaLabel = '') {
  return '<button type="button" class="btn '+style+'" data-n-db="'+action+'" data-n-id="'+esc(id)+'"'+
    (ariaLabel ? ' aria-label="'+esc(ariaLabel)+'"' : '')+'>'+esc(label)+'</button>';
}

function notionTaskById(id) {
  return (data.notionTasks || []).find(task => task.id === id);
}

function notionTaskProject(task) {
  const project = rec(task.projectId);
  return project?.type === 'Projects' ? project : null;
}

function notionDbRowLink(name, item) {
  if (name === 'Projects') return openRecord(item.id, item.title);
  return '<button type="button" class="title link" data-n-db="open-task" data-n-id="'+esc(item.id)+'">'+esc(item.title)+'</button>';
}

function notionDbStatus(value) {
  const style = value === 'Completed' ? 'complete' : value === 'In progress' ? 'working' : value === 'Waiting' ? 'waiting' : '';
  return '<span class="n-db-status '+style+'">'+esc(value)+'</span>';
}

function notionDbOption(value, label, selected) {
  return '<option value="'+esc(value)+'"'+(value === selected ? ' selected' : '')+'>'+esc(label)+'</option>';
}

function notionDbItems(name) {
  const state = notionDbState[name];
  const source = name === 'Tasks' ? data.notionTasks || [] : data.records.filter(record => record.type === 'Projects');
  const items = source.filter(item => relevant(item) && (!state.filter || item.status === state.filter));
  if (state.sort === 'title') items.sort((left, right) => left.title.localeCompare(right.title, undefined, {sensitivity: 'base'}));
  if (state.sort === 'due') items.sort((left, right) => (left.due || '9999-12-31').localeCompare(right.due || '9999-12-31') || left.title.localeCompare(right.title));
  return items;
}

function notionDbProperties(name, item) {
  if (name === 'Projects') return '<span>'+esc(item.space)+'</span><span>'+item.progress+'% complete</span>';
  const project = notionTaskProject(item);
  return (project ? '<span>'+esc(project.title)+'</span>' : '')+
    (item.due ? '<time datetime="'+esc(item.due)+'">'+esc(displayDate(item.due))+'</time>' : '')+
    '<span>'+esc(item.space)+'</span>';
}

function notionDbTable(name, items) {
  const projectColumns = '<th scope="col">Workspace</th><th scope="col">Progress</th>';
  const taskColumns = '<th scope="col">Due date</th><th scope="col">Project</th><th scope="col">Workspace</th>';
  const rows = items.map(item => {
    const project = notionTaskProject(item);
    const extra = name === 'Projects'
      ? '<td>'+esc(item.space)+'</td><td><div class="n-db-progress"><progress max="100" value="'+item.progress+'" aria-label="Project progress"></progress><span>'+item.progress+'%</span></div></td>'
      : '<td>'+(item.due ? '<time datetime="'+esc(item.due)+'">'+esc(displayDate(item.due,{year:'numeric',month:'short',day:'numeric'}))+'</time>' : '')+
        '</td><td>'+(project ? openRecord(project.id,project.title) : '')+'</td><td>'+esc(item.space)+'</td>';
    return '<tr><th scope="row">'+notionDbRowLink(name,item)+'</th><td>'+notionDbStatus(item.status)+'</td>'+extra+'</tr>';
  }).join('');
  return '<div class="n-db-table-wrap" tabindex="0" aria-label="'+esc(name)+' table"><table class="n-db-table"><thead><tr><th scope="col">Name</th><th scope="col">Status</th>'+
    (name === 'Projects' ? projectColumns : taskColumns)+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function notionDbList(name, items) {
  return '<ul class="n-db-list">'+items.map(item => '<li><div>'+notionDbRowLink(name,item)+
    '<div class="n-db-meta">'+notionDbProperties(name,item)+'</div></div>'+notionDbStatus(item.status)+'</li>').join('')+'</ul>';
}

function notionDbBoard(name, items) {
  const statusesForView = name === 'Tasks' ? notionTaskStatuses : statuses;
  const active = notionDbState[name].filter;
  const lanes = active ? statusesForView.filter(status => status === active) : statusesForView;
  return '<div class="n-db-board" aria-label="'+esc(name)+' by status">'+lanes.map(status => {
    const cards = items.filter(item => item.status === status);
    return '<section class="n-db-lane"><h2>'+notionDbStatus(status)+' <span>'+cards.length+'</span></h2>'+
      (cards.length ? '<ul>'+cards.map(item => '<li>'+notionDbRowLink(name,item)+'<div class="n-db-meta">'+notionDbProperties(name,item)+'</div></li>').join('')+'</ul>' : '<p class="muted">No items</p>')+'</section>';
  }).join('')+'</div>';
}

function notionDbCalendar(items) {
  const monthStart = notionTaskCalendarMonth+'-01';
  const firstWeekday = new Date(monthStart+'T12:00:00Z').getUTCDay();
  const nextMonth = new Date(monthStart+'T12:00:00Z');
  nextMonth.setUTCMonth(nextMonth.getUTCMonth() + 1);
  const monthDays = Number(offsetDate(nextMonth.toISOString().slice(0,10),-1).slice(-2));
  const days = Math.ceil((firstWeekday+monthDays)/7)*7;
  const byDate = new Map();
  for (const task of items) {
    if (!task.due) continue;
    if (!byDate.has(task.due)) byDate.set(task.due,[]);
    byDate.get(task.due).push(task);
  }
  const cellMarkup = Array.from({length:days},(_,index) => {
    const date = offsetDate(monthStart,index-firstWeekday);
    const count = byDate.get(date)?.length || 0;
    const title = displayDate(date,{weekday:'long',month:'long',day:'numeric'})+(count ? ', '+count+(count === 1 ? ' task' : ' tasks') : '');
    return '<button type="button" class="n-db-date'+(date.slice(0,7) !== notionTaskCalendarMonth ? ' outside' : '')+'" data-n-db="calendar-date" data-n-id="'+date+'" aria-label="'+esc(title)+'" aria-pressed="'+(notionTaskCalendarDay === date)+'">'+
      '<span>'+Number(date.slice(-2))+'</span>'+(count ? '<span class="n-db-cal-count" aria-hidden="true">'+count+'</span>' : '')+'</button>';
  }).join('');
  const selected = byDate.get(notionTaskCalendarDay) || [];
  return '<div class="n-db-calendar"><div class="n-db-cal-heading"><h2>'+esc(displayDate(monthStart,{month:'long',year:'numeric'}))+'</h2><div class="n-db-cal-actions">'+
    notionDbButton('‹', 'calendar-prev','','quiet','Previous month')+
    notionDbButton('Today', 'calendar-today','','quiet')+
    notionDbButton('›', 'calendar-next','','quiet','Next month')+'</div></div>'+
    '<div class="n-db-calendar-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(label => '<span class="n-db-weekday">'+label+'</span>').join('')+cellMarkup+'</div>'+
    '<div class="n-db-cal-details"><h3>'+esc(displayDate(notionTaskCalendarDay,{weekday:'long',month:'long',day:'numeric'}))+'</h3>'+
    (selected.length ? notionDbList('Tasks',selected) : empty('No tasks due on this date.'))+
    notionDbButton('Add task for this date','new-task-date',notionTaskCalendarDay,'quiet')+'</div></div>';
}

function notionDatabasePage(name) {
  const state = notionDbState[name];
  const items = notionDbItems(name);
  const statusChoices = name === 'Tasks' ? notionTaskStatuses : statuses;
  const descriptions = {
    Projects:'Projects, notes, attachments, and progress.',
    Tasks:'Plan your work and link tasks to projects.'
  };
  const action = name === 'Tasks' ? notionDbButton('+ New task', 'new-task', '', 'primary') : btn('New project','new-record',{style:'primary',icon:'plus'});
  const controls = '<div class="n-db-controls"><div class="n-db-views" role="group" aria-label="Database view">'+
    notionDbViews[name].map(layout => '<button type="button" data-n-db="view-layout" data-n-id="'+layout+'" aria-pressed="'+(layout === state.layout)+'">'+layout+'</button>').join('')+
    '</div><div class="n-db-filters"><label>Status<select data-n-select="filter">'+notionDbOption('', 'All statuses', state.filter)+
    statusChoices.map(status => notionDbOption(status,status,state.filter)).join('')+'</select></label>'+
    '<label>Sort<select data-n-select="sort">'+notionDbOption('created','Default',state.sort)+
    notionDbOption('title','Name A–Z',state.sort)+(name === 'Tasks' ? notionDbOption('due','Due date',state.sort) : '')+'</select></label></div></div>';
  let content;
  switch (state.layout) {
    case 'Board': content = notionDbBoard(name,items); break;
    case 'Calendar': content = notionDbCalendar(items); break;
    case 'List': content = items.length ? notionDbList(name,items) : empty('No matching '+name.toLowerCase()+'.'); break;
    default: content = notionDbTable(name,items)+(items.length ? '' : empty('No matching '+name.toLowerCase()+'.'));
  }
  return heading(name,descriptions[name],action)+'<section class="n-db-panel" aria-label="'+esc(name)+' database">'+controls+content+'</section>';
}

function notionTaskPage(id) {
  const task = notionTaskById(id);
  if (!task) return heading('Task unavailable','This task may have been removed.', '<button type="button" class="btn" data-view="Tasks">Back to Tasks</button>');
  const project = notionTaskProject(task);
  return '<div><button class="btn quiet" type="button" data-view="Tasks">'+icon('back')+' Tasks</button></div>'+
    heading(task.title,'',notionDbButton('Edit task','edit-task',task.id))+
    '<section class="n-db-panel n-task-page" aria-label="Task properties"><dl class="n-db-properties"><div><dt>Status</dt><dd>'+notionDbStatus(task.status)+'</dd></div>'+
    '<div><dt>Due date</dt><dd>'+(task.due ? '<time datetime="'+esc(task.due)+'">'+esc(displayDate(task.due,{year:'numeric',month:'long',day:'numeric'}))+'</time>' : 'No due date')+'</dd></div>'+
    '<div><dt>Project</dt><dd>'+(project ? openRecord(project.id,project.title) : 'No linked project')+'</dd></div><div><dt>Workspace</dt><dd>'+esc(task.space)+'</dd></div></dl>'+
    notionDbButton(task.status === 'Completed' ? 'Reopen task' : 'Mark complete','toggle-task',task.id,'quiet')+'</section>'+
    (task.body ? '<section class="n-db-panel n-task-page"><h2>Details</h2><p class="n-task-body">'+esc(task.body)+'</p></section>' : '');
}

function notionTaskSearch(matches) {
  return (data.notionTasks || []).filter(task => matches(task.title,task.body,task.status,task.space,notionTaskProject(task)?.title))
    .map(task => '<div class="row"><div class="row-main">'+notionDbRowLink('Tasks',task)+'<br><small>Task · '+esc(task.space)+'</small></div></div>');
}

function notionTasksForProject(projectId) {
  const tasks = (data.notionTasks || []).filter(task => task.projectId === projectId);
  if (!tasks.length) return '';
  return '<section class="n-db-panel n-task-page" aria-label="Related tasks"><div class="n-db-cal-heading"><h2>Related tasks</h2>'+
    notionDbButton('Add task','new-task-project',projectId,'quiet')+'</div>'+notionDbList('Tasks',tasks)+'</section>';
}

function notionTaskForm(trigger, task, initial = {}) {
  const projects = data.records.filter(record => record.type === 'Projects').map(record => [record.id,record.title+' · '+record.space]);
  const chosenProject = data.records.find(record => record.type === 'Projects' && record.id === (task?.projectId || initial.projectId));
  const defaultSpace = chosenProject?.space || (space === 'Personal' ? 'Personal' : 'R2R');
  const fields = field('Task name','title',task?.title,{required:true,attrs:'maxlength="160"'})+
    '<div class="form-grid">'+select('Status','status',notionTaskStatuses,task?.status || notionTaskStatuses[0])+
    field('Due date','due',task?.due || initial.due,{type:'date'})+'</div>'+
    '<div class="form-grid">'+select('Workspace','space',groups,task?.space || defaultSpace)+
    select('Project','projectId',[['','No linked project'],...projects],chosenProject?.id || '')+'</div>'+area('Details','body',task?.body);
  modal(task ? 'Edit task' : 'New task','<form data-n-db-form="task" data-id="'+esc(task?.id || '')+'">'+fields+
    '<p class="feedback" role="alert"></p><div class="form-actions">'+
    (task ? notionDbButton('Delete task','delete-task',task.id,'danger quiet') : '')+
    btn('Cancel','close',{style:'quiet'})+'<button type="submit" class="btn primary">Save task</button></div></form>',trigger);
}

function notionDbSubmit(form) {
  if (!form.reportValidity()) return;
  const values = new FormData(form);
  const read = name => String(values.get(name) || '').trim();
  const id = form.dataset.id || uid();
  const task = {id,title:read('title'),status:read('status'),due:read('due'),projectId:read('projectId'),space:read('space'),body:read('body')};
  const dateIsValid = !task.due || (isoDate(task.due) && offsetDate(task.due,0) === task.due);
  if (!task.title || !dateIsValid || !notionTaskStatuses.includes(task.status) || !groups.includes(task.space) ||
      (task.projectId && !notionTaskProject(task))) {
    form.querySelector('.feedback').textContent = 'Enter a name and choose available task properties.';
    return;
  }
  const changed = save(workspace => {
    workspace.notionTasks ??= [];
    const index = workspace.notionTasks.findIndex(item => item.id === id);
    if (form.dataset.id && index < 0) throw new Error('Task already removed');
    if (index < 0) workspace.notionTasks.unshift(task);
    else workspace.notionTasks[index] = task;
  },'Task saved.');
  if (changed) {
    dialog.close();
    if (!relevant(task)) space = 'All';
    go('Task',id);
  }
}

function notionDbMakeCalendarMove(action, value) {
  if (action === 'calendar-date' || action === 'calendar-today') {
    notionTaskCalendarDay = action === 'calendar-today' ? day() : value;
    notionTaskCalendarMonth = notionTaskCalendarDay.slice(0,7);
  } else {
    const date = new Date(notionTaskCalendarMonth+'-01T12:00:00Z');
    date.setUTCMonth(date.getUTCMonth() + (action === 'calendar-prev' ? -1 : 1));
    notionTaskCalendarDay = date.toISOString().slice(0,10);
    notionTaskCalendarMonth = notionTaskCalendarDay.slice(0,7);
  }
  render();
  if (action === 'calendar-date') {
    main.querySelector('[data-n-db="calendar-date"][aria-pressed="true"]')?.focus();
  } else main.querySelector('[data-n-db="'+action+'"]')?.focus();
}

document.addEventListener('change',event => {
  const field = event.target.closest('[data-n-select]');
  const state = notionDbState[view];
  if (!field || !state) return;
  state[field.dataset.nSelect] = field.value;
  render();
  main.querySelector('[data-n-select="'+field.dataset.nSelect+'"]')?.focus();
});
document.addEventListener('submit',event => {
  if (event.target.dataset.nDbForm !== 'task') return;
  event.preventDefault();
  event.stopImmediatePropagation();
  notionDbSubmit(event.target);
},true);
document.addEventListener('keydown',event => {
  if (event.key !== 'Enter' || event.isComposing || !event.target.matches('[data-n-db-form="task"] input[type="text"]')) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  event.target.form.requestSubmit();
},true);
document.addEventListener('click',event => {
  const button = event.target.closest('button[data-n-db]');
  if (!button) return;
  const {nDb:action,nId:id} = button.dataset;
  const task = notionTaskById(id);
  if (action === 'view-layout' && notionDbViews[view]?.includes(id)) {
    notionDbState[view].layout = id;
    render();
    main.querySelector('[data-n-db="view-layout"][aria-pressed="true"]')?.focus();
  } else if (['calendar-date','calendar-today','calendar-prev','calendar-next'].includes(action) && view === 'Tasks') {
    notionDbMakeCalendarMove(action,id);
  } else if (action === 'new-task') notionTaskForm(button);
  else if (action === 'new-task-date') notionTaskForm(button,null,{due:id});
  else if (action === 'new-task-project') notionTaskForm(button,null,{projectId:id});
  else if (action === 'open-task' && task) {
    if (dialog.open) dialog.close();
    if (!relevant(task)) space = 'All';
    go('Task',id);
  } else if (action === 'edit-task' && task) notionTaskForm(button,task);
  else if (action === 'toggle-task' && task) {
    const nextStatus = task.status === 'Completed' ? 'To do' : 'Completed';
    save(workspace => {
      const current = workspace.notionTasks?.find(item => item.id === id);
      if (current) current.status = nextStatus;
    },nextStatus === 'Completed' ? 'Task completed.' : 'Task reopened.');
    main.querySelector('[data-n-db="toggle-task"]')?.focus();
  } else if (action === 'delete-task' && task) {
    modal('Delete task?','<p>'+esc(task.title)+'</p><p class="feedback" role="alert"></p><div class="form-actions">'+
      notionDbButton('Back','edit-task',id,'quiet')+notionDbButton('Delete task','confirm-delete-task',id,'danger')+'</div>',button);
  } else if (action === 'confirm-delete-task' && task) {
    const changed = save(workspace => {
      workspace.notionTasks = (workspace.notionTasks || []).filter(item => item.id !== id);
    },'Task deleted.');
    if (changed) {
      dialog.close();
      go('Tasks');
    }
  }
});

function notionDashboardValid(value) {
  if (value === undefined) return true;
  if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
  const {events, habits, goals, favorites} = value;
  const validDate = text => {
    if (typeof text !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(text)) return false;
    const date = new Date(text + 'T12:00:00Z');
    return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === text;
  };
  const validRows = (rows, check) => Array.isArray(rows) &&
    rows.every(row => row && typeof row.id === 'string' && typeof row.title === 'string' &&
      ['Personal', 'R2R'].includes(row.space) && check(row)) &&
    new Set(rows.map(row => row.id)).size === rows.length;
  const validTime = text => typeof text === 'string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(text);
  return validRows(events, row => validDate(row.date) && validTime(row.start) &&
    validTime(row.end) && row.start < row.end) &&
    validRows(habits, row => Array.isArray(row.checks) && row.checks.every(validDate)) &&
    validRows(goals, row => typeof row.done === 'boolean') &&
    Array.isArray(favorites) && favorites.every(key => ['flowers', 'coffee', 'notebook'].includes(key));
}

function notionRemoveDashboardSamples(workspace) {
  const dashboard = workspace.notionDashboard;
  if (!dashboard) return;
  for (const collection of ['events', 'habits', 'goals']) {
    dashboard[collection] = dashboard[collection].filter(item => !item.sample);
  }
}

function ndClockTime() {
  const parts = ndCurrentTime.formatToParts();
  const getPart = key => parts.find(part => part.type === key).value;
  return getPart('hour') + ':' + getPart('minute') + ' ' + getPart('dayPeriod').replaceAll('.','').toUpperCase();
}

function ndWeekStart(date) {
  const weekday = new Date(date + 'T12:00:00Z').getUTCDay();
  return offsetDate(date, -((weekday + 6) % 7));
}

function ndMonthOffset(month, distance) {
  const date = new Date(month + '-01T12:00:00Z');
  date.setUTCMonth(date.getUTCMonth() + distance);
  return date.toISOString().slice(0, 7);
}

function ndSeedDashboard() {
  const date = day();

  const checks = Array.from({length:4}, (_, index) => offsetDate(week, index)).filter(value => value <= date);
  const eventValues = [
    ['Morning Routine', '06:00', '07:30', 'Personal'],
    ['Deep Work', '08:00', '11:00', 'R2R'],
    ['Meetings', '11:00', '12:00', 'R2R'],

  const goals = ['Launch my online store','Read 12 books this year','Save $10,000','Travel to 3 new places','Run a half marathon'];
  return {
    events:eventValues.map(([title,start,end,space], index) => ({id:'nd-event-' + index,title,date,start,end,space,sample:true})),

function ndEventOrder(a, b) {

function ndLocalTime(text) {
  const [h,m] = text.split(':').map(Number);
  return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
}

function ndMinutes(text) {
  const [h,m] = text.split(':').map(Number);
  return h * 60 + m;
}

function ndScheduleRing(events, date) {
  let lastEnd = 0;
  const stops = [];
  const addStop = (color, start, end) => stops.push(color + ' ' + (start / 14.4) + '% ' + (end / 14.4) + '%');
  events.forEach((event,index) => {
    const start = ndMinutes(event.start);
    const end = ndMinutes(event.end);
    if (start > lastEnd) addStop('#eae0d8', lastEnd, start);
    if (end > lastEnd) addStop(ndColors[index % ndColors.length], Math.max(start,lastEnd), end);
    lastEnd = Math.max(lastEnd, end);
  });
  if (lastEnd < 1440) addStop('#eae0d8', lastEnd, 1440);
  const now = date === day();
  const label = now ? ndClockTime() : events.length ? ndLocalTime(events[0].start) : displayDate(date);
  const [digits, meridiem] = label.toUpperCase().split(/\s+(?=AM$|PM$)/);
  return '<div class="nd-clock" role="img" aria-label="' + esc((now?'Current time: ':events.length?'First event: ':'Selected day: ') + label) +
    '"><span class="nd-clock-midnight">12 AM</span><span class="nd-clock-six">6 AM</span><span class="nd-clock-noon">12 PM</span>' +
    '<span class="nd-clock-evening">6 PM</span><div class="nd-ring" style="--nd-events:' + stops.join(',') + '"><div class="nd-ring-face">' +
    '<strong' + (now?' data-nd-current-time':'') + '>' + esc(digits) + '</strong>' +
    (meridiem ? '<span' + (now?' data-nd-current-period':'') + '>' + esc(meridiem) + '</span>' : '') + '</div></div></div>';
}

function ndEventRows(events, mode) {
  if (!events.length) return '<p class="nd-empty">Nothing scheduled.</p>';
  const list = mode === 'calendar' ? events.slice(0, 3) : events;
  const rows = list.map((event,index) => ndAction('event-edit', 'Edit ' + event.title, {
    value:event.id,
    css:'nd-event',
    content: mode === 'calendar'
      ? '<span>' + esc(ndLocalTime(event.start)) + '</span><span>' + esc(event.title) + '</span>'
      : '<span class="nd-event-dot" style="--nd-dot:' + ndColors[index % ndColors.length] + '"></span><span>' +
        esc(event.title) + '</span><time datetime="' + esc(event.start) + '">' +
        esc(ndLocalTime(event.start) + ' – ' + ndLocalTime(event.end)) + '</time>'
  })).join('');
  return rows + (mode === 'calendar' && events.length > list.length
    ? ndAction('schedule', 'View all ' + events.length + ' events', {css:'nd-more'}) : '');
}
