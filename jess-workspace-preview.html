function ndCalendarPanel(title = 'Calendar') {
  const month = ndCalendar.month;
  const firstOfMonth = month + '-01';
  const firstDay = new Date(firstOfMonth + 'T12:00:00Z').getUTCDay();
  const firstCell = offsetDate(firstOfMonth, -firstDay);
  const nextMonth = ndMonthOffset(month, 1) + '-01';
  const count = Math.max(35, Math.ceil((firstDay + Number(offsetDate(nextMonth,-1).slice(-2))) / 7) * 7);
  const tasks = (data.notionTasks || []).filter(task => task.due && relevant(task));
  const scheduledDates = new Set([
    ...ndDashboardData().events.filter(relevant).map(event => event.date),
    ...tasks.map(task => task.due)
  ]);
  const due = tasks.filter(task => task.due === ndCalendar.selected);
  const events = ndEvents(ndCalendar.selected);
  const today = day();
  const days = Array.from({length:count}, (_, index) => {
    const date = offsetDate(firstCell, index);
    const selected = date === ndCalendar.selected;
    const attrs = 'aria-pressed="' + selected + '"' + (date === today ? ' aria-current="date"' : '');
    return ndAction('day', date, {
      value:date,
      css:'nd-day' + (date.slice(0,7) !== month ? ' nd-day-outside' : '') + (scheduledDates.has(date)?' nd-day-has-event':''),
      content:'<span>' + Number(date.slice(-2)) + '</span>',
      extra:attrs
    });
  }).join('');
  return '<section class="nd-panel nd-calendar">' + ndPanelTitle(title,'calendar') +
    '<div class="nd-month-toolbar"><strong aria-live="polite">' + esc(displayDate(firstOfMonth,{month:'long',year:'numeric'})) +
    '</strong><div class="nd-calendar-nav">' + ndAction('month-prev','Previous month',{css:'nd-icon-button',content:ndIcon('left',16)}) +
    ndAction('month-next','Next month',{css:'nd-icon-button',content:ndIcon('right',16)}) +
    ndAction('today','Today',{css:'nd-today'}) +
    '</div></div><div class="nd-month-grid">' +
    ['S','M','T','W','T','F','S'].map(letter=>'<span class="nd-weekday" aria-hidden="true">'+letter+'</span>').join('') +
    days + '</div><div class="nd-calendar-agenda">' + (events.length || !due.length ? ndEventRows(events,'calendar') : '') +
    due.map(task => '<button class="nd-button nd-event nd-task-due" type="button" data-n-db="open-task" data-n-id="' + esc(task.id) +
      '" aria-label="Open task ' + esc(task.title) + '"><span>Due</span><span>' + esc(task.title) + '</span></button>').join('') +
    '</div></section>';
}

const ndCollectionNames = {event:'events', habit:'habits', goal:'goals'};
const ndFind = (kind,id) => ndDashboardData()[ndCollectionNames[kind]]?.find(item => item.id === id);

function ndSaveForm(form) {
  if (!form.reportValidity()) return;
  const kind = form.dataset.ndForm;
  const values = new FormData(form);
  const title = String(values.get('title') || '').trim();
  const selectedSpace = values.get('space');
  const feedback = form.querySelector('.feedback');
  if (!title || title.length > 120 || !groups.includes(selectedSpace)) {
    feedback.textContent = 'Enter a name and select a space.';
    return;
  }
  const id = form.dataset.ndId || uid();
  const current = form.dataset.ndId ? ndFind(kind,id) : null;
  if (form.dataset.ndId && !current) {
    feedback.textContent = 'This item was removed in another tab.';
    return;
  }
  const next = {...current,id,title,space:selectedSpace};
  delete next.sample;
  if (kind === 'event') {
    next.date = values.get('date');
    next.start = values.get('start');
    next.end = values.get('end');
    if (!notionDashboardValid({events:[next],habits:[],goals:[],favorites:[]})) {
      feedback.textContent = 'Choose a valid date and an end time after the start.';
      return;
    }
  } else if (kind === 'goal') {
    next.done = current?.done ?? false;
  } else {
    next.checks = current?.checks || [];
  }

  const previousDate = ndCalendar.selected;
  const previousMonth = ndCalendar.month;
  if (kind === 'event') {
    ndCalendar.selected = next.date;
    ndCalendar.month = next.date.slice(0,7);
  }
  const saved = ndSave(dashboard => {
    const list = dashboard[ndCollectionNames[kind]];
    const index = list.findIndex(item => item.id === id);
    if (current && index < 0) throw new Error('The item no longer exists.');
    if (index < 0) list.push(next);
    else {
      if (kind === 'goal') next.done = list[index].done;
      if (kind === 'habit') next.checks = list[index].checks;
      list[index] = next;
    }
  }, kind[0].toUpperCase() + kind.slice(1) + ' saved.');
  if (saved) dialog.close();
  else {
    ndCalendar.selected = previousDate;
    ndCalendar.month = previousMonth;
  }
}

function ndFocusControl(action, value, date) {
  const candidates = main.querySelectorAll('[data-n-dash="' + action + '"]');
  [...candidates].find(node => (value === undefined || node.dataset.ndValue === value) &&
    (date === undefined || node.dataset.ndDate === date))?.focus({preventScroll:true});
}

document.addEventListener('click', event => {
  const control = event.target.closest('button[data-n-dash]');
  if (!control) return;
  const action = control.dataset.nDash;
  const value = control.dataset.ndValue;
  if (action === 'save') {
    ndSaveForm(control.form);
    return;
  }
  if (action.endsWith('-add') || action.endsWith('-edit')) {
    const [kind, verb] = action.split('-');
    const item = verb === 'edit' ? ndFind(kind,value) : undefined;
    if (verb === 'add' || item) ndModalForm(kind,item,control);
    return;
  }
  if (action === 'remove') {
    const kind = control.dataset.ndKind;
    const item = ndFind(kind,value);
    if (!item) return;
    modal('Delete ' + kind + '?','<p>Remove “' + esc(item.title) + '” from your workspace?</p>' +
      '<p class="feedback" role="alert"></p><div class="form-actions">' + btn('Cancel','close',{style:'quiet'}) +
      ndAction('remove-confirm','Delete',{value,extra:'data-nd-kind="' + kind + '"',css:'btn danger'}) + '</div>',control);
    return;
  }
  if (action === 'remove-confirm') {
    const kind = control.dataset.ndKind;
    const saved = ndSave(dashboard => {
      const collection = ndCollectionNames[kind];
      dashboard[collection] = dashboard[collection].filter(item => item.id !== value);
    },'Removed from your workspace.');
    if (saved) dialog.close();
    return;
  }
  if (action === 'favorite') {
    ndSave(dashboard => {
      dashboard.favorites = dashboard.favorites.includes(value)
        ? dashboard.favorites.filter(key => key !== value)
        : [...dashboard.favorites,value];
    });
    ndFocusControl(action,value);
    return;
  }
  if (action === 'schedule') {
    main.querySelector('.nd-schedule-agenda')?.focus();
    return;
  }
  if (action === 'day' || action === 'today') {
    ndCalendar.selected = action === 'today' ? day() : value;
    ndCalendar.month = ndCalendar.selected.slice(0,7);
  } else if (action === 'month-prev' || action === 'month-next') {
    ndCalendar.month = ndMonthOffset(ndCalendar.month,action === 'month-prev' ? -1 : 1);
    ndCalendar.selected = ndCalendar.month + '-01';
  } else if (action === 'week-current') {
    ndCalendar.week = ndWeekStart(day());
  } else if (action === 'week-prev' || action === 'week-next') {
    ndCalendar.week = offsetDate(ndCalendar.week,action === 'week-prev' ? -7 : 7);
  } else return;
  render();
  ndFocusControl(action,value);
},true);

document.addEventListener('change', event => {
  const control = event.target;
  const action = control.dataset.nDash;
  if (action !== 'habit-check' && action !== 'goal-check') return;
  const {ndValue, ndDate} = control.dataset;
  const checked = control.checked;
  const saved = ndSave(dashboard => {
    const list = action === 'habit-check' ? dashboard.habits : dashboard.goals;
    const item = list.find(entry => entry.id === ndValue);
    if (!item) throw new Error('This item no longer exists.');
    delete item.sample;
    if (action === 'habit-check') {
      item.checks = checked ? [...new Set([...item.checks,ndDate])] : item.checks.filter(date => date !== ndDate);
    } else item.done = checked;
  });
  if (saved) ndFocusControl(action,ndValue,ndDate);
  else control.checked = !checked;
},true);

document.addEventListener('submit', event => {
  if (!event.target.matches('form[data-nd-form]')) return;
  event.preventDefault();
  event.stopPropagation();
  ndSaveForm(event.target);
},true);

document.addEventListener('keydown', event => {
  if (event.key !== 'Enter' || event.isComposing ||
      !event.target.matches('form[data-nd-form] input[type="text"]')) return;
  event.preventDefault();
  ndSaveForm(event.target.form);
},true);

setInterval(() => {
  const clock = main.querySelector('[data-nd-current-time]');
  if (!clock) return;
  const [time,period] = ndClockTime().split(' ');
  clock.textContent = time;
  const periodElement = main.querySelector('[data-nd-current-period]');
  if (periodElement) periodElement.textContent = period || '';
  clock.closest('.nd-clock')?.setAttribute('aria-label','Current time: ' + [time,period].filter(Boolean).join(' '));
},30000);

Object.assign(paths, {

function notionPhoto(kind,alt='') {
  return '<span class="nd-photo nd-photo-'+esc(kind)+'" '+(alt?'role="img" aria-label="'+esc(alt)+'"':'aria-hidden="true"')+'></span>';
}
function notionActiveSection() {
  if (view==='Task') return 'Tasks';
  if (view!=='Page') return view;
  let page=notionPageById(recordId);
  const seen=new Set();
  while (page && !seen.has(page.id)) {
    seen.add(page.id);
    if (page.parent.startsWith('section:')) return page.parent.slice(8);
    if (page.parent.startsWith('record:')) return rec(page.parent.slice(7))?.type;
    page=notionPageById(page.parent);
  }
}
function notionSidebarPages(parent, ancestors=new Set()) {
  const pages=notionChildPages(parent).filter(page=>!ancestors.has(page.id));
  if (!pages.length) return '';
  return '<ul class="notion-sidebar-pages">'+pages.map(page=>{
    const path=new Set(ancestors).add(page.id);
    return '<li>'+notionOpenPageMarkup(page)+notionSidebarPages(page.id,path)+'</li>';
  }).join('')+'</ul>';
}
function notionNavigationMarkup() {
  const here=notionActiveSection();
  return '<button class="notion-home-mark" type="button" data-view="Today" aria-label="Workspace home">'+icon('leaf')+'</button>'+
    notionSections.map(section=>'<section class="notion-nav-group" aria-label="'+esc(section.label)+'">'+
      '<p class="notion-nav-label">'+(section.label==='Productivity'?'':icon(section.icon))+esc(section.label)+'</p>'+
      section.pages.map(([target,label,symbol])=>{
        const count=target==='Inbox'?data.inbox.filter(relevant).length:0;
        return '<button type="button" class="nav-button" data-view="'+esc(target)+'"'+(here===target?' aria-current="page"':'')+'>'+
          icon(symbol)+'<span>'+esc(label)+'</span>'+(count?'<small class="nav-count">'+count+'</small>':'')+'</button>'+
          (here===target?notionSidebarPages('section:'+target):'');
      }).join('')+'</section>').join('')+
    '<div class="notion-sidebar-quote"><span aria-hidden="true">“</span><p>You are creating the life of your dreams.</p>'+icon('heart')+'</div>';
}
function notionContent() {
  switch(view) {
    case 'Today': return notionDashboardPage();
    case 'Calendar': return notionCalendarPage();
    case 'Goals': return typeof notionGoalsPage==='function'?notionGoalsPage():notionSectionPage(view);
    case 'Inbox': return inboxPage();
    case 'Admin': return adminPage();
    case 'Page': return notionPagePage(recordId);
    case 'Task': return notionTaskPage(recordId);
    default: {
      const record=rec(recordId);
      if (record) {
        const related=record.type==='Projects'?notionTasksForProject(recordId):'';
        return recordPage(record)+notionRecordBlocks(recordId)+related;
      }
      if (view==='Tasks' || view==='Projects') return notionDatabasePage(view);
      if (view==='Employees' || view==='Clients') return listPage(view);
      return notionSectionPage(notionNavigation.has(view)?view:'Notes');
    }
  }
}
function notionTaskDataValid(tasks) {
  if (!Array.isArray(tasks)) return false;
  return tasks.every(task=>task && typeof task.id==='string' && typeof task.title==='string' &&
    ['To do','In progress','Completed'].includes(task.status) && (!task.due || isoDate(task.due)) &&
    typeof task.projectId==='string' && typeof task.body==='string' && groups.includes(task.space)) &&
    new Set(tasks.map(task=>task.id)).size===tasks.length;
}
function notionExtensionValid(value) {
  return (value.notionPages===undefined || notionEditorValid(value.notionPages)) &&
    (value.notionTasks===undefined || notionTaskDataValid(value.notionTasks)) &&
    (value.notionDashboard===undefined || notionDashboardValid(value.notionDashboard));
}
function notionMergeBackup(target,source) {
  for (const name of ['notionPages','notionTasks']) {
    if (!source[name]?.length) continue;
    target[name] ??= [];
    const existing=new Set(target[name].map(item=>item.id));
    target[name].push(...source[name].filter(item=>!existing.has(item.id)));
  }
  if (source.notionDashboard) {
    if (!target.notionDashboard) {
      target.notionDashboard=source.notionDashboard;
      return;
    }
    for (const name of ['events','habits','goals']) {
      const saved=target.notionDashboard[name];
      const positions=new Map(saved.map((item,index)=>[item.id,index]));
      for (const item of source.notionDashboard[name]) {
        const index=positions.get(item.id);
        if (index===undefined) saved.push(item);
        else if (saved[index].sample && !item.sample) saved[index]=item;
        else if (name==='habits') saved[index].checks=[...new Set([...saved[index].checks,...item.checks])];
      }
    }
    target.notionDashboard.favorites=[...new Set([...target.notionDashboard.favorites,...source.notionDashboard.favorites])];
  }
}
function notionCloseMobileMenu() {
  document.querySelector('.shell').classList.remove('notion-nav-open');
  document.querySelector('#notion-menu').setAttribute('aria-expanded','false');
}
document.querySelector('#notion-menu').innerHTML=icon('menu');

document.addEventListener('click',event=>{
  const target=event.target.closest('button');
  if (!target) return;
  if (target.id==='notion-menu') {
    const expanded=document.querySelector('.shell').classList.toggle('notion-nav-open');
    target.setAttribute('aria-expanded',String(expanded));
  }
  if (target.id==='notion-page-plus') {
    const parent=view==='Page'&&notionPageById(recordId)?recordId:'section:Notes';
    notionCreatePage(target,parent);
  }
  if (target.dataset.view || target.dataset.nEdit==='open-page') notionCloseMobileMenu();
});
document.addEventListener('keydown',event=>{
  if (event.key==='Escape') notionCloseMobileMenu();
  if ((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k') {
    event.preventDefault();
    if (!dialog.open) document.querySelector('[data-action="search"]').click();
  }
});

try {
  const raw = localStorage.getItem(key);
  blockedStorage=Boolean(raw);
  data = raw ? JSON.parse(raw) : sample();
  if (!validData(data)) throw new Error('Unreadable saved data');
  blockedStorage=false;
  if (!raw) localStorage.setItem(key,JSON.stringify(data));
} catch {
  data = validData(data) ? data : sample();
  storageStatus = blockedStorage ? 'Previous data could not be read' : 'Browser storage unavailable';
}
