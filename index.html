<title>Life & CEO OS — Category Colour Studio</title>
<style>
:root{
  --forest:#2f4337;--forest-2:#24352c;--olive:#788466;--sage:#dfe7dc;--cream:#f6f1e8;
  --paper:#fffdf8;--beige:#eadfce;--gold:#b69a62;--ink:#302d29;--muted:#746f67;

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--cream)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(145deg,#f7f2e9,#eef2ea);font-family:Inter,"Avenir Next",Avenir,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
svg{display:block}
.app{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--rail);min-height:100vh;transition:grid-template-columns .2s ease}

.sidebar{position:sticky;top:0;height:100vh;z-index:30;padding:14px 12px;display:flex;flex-direction:column;overflow:hidden;color:#f8f3e9;background:linear-gradient(180deg,var(--forest-2),var(--forest));border-right:1px solid rgba(255,255,255,.08);box-shadow:12px 0 30px rgba(25,39,30,.09);width:var(--left);transition:width .2s ease,box-shadow .2s ease}
.app.compact .sidebar{width:var(--left-compact)}
.app.compact .sidebar:hover{width:var(--left);box-shadow:18px 0 38px rgba(25,39,30,.18)}
.brand{height:70px;display:flex;align-items:center;gap:12px;padding:0 8px;margin-bottom:8px;white-space:nowrap}
.brand-mark{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:14px;border:1px solid rgba(232,216,182,.38);color:#ead8b5;background:rgba(255,255,255,.05);font:600 20px Georgia,serif}

.app.compact .brand-copy,.app.compact .nav-label,.app.compact .mode-copy{opacity:0;transform:translateX(-8px);pointer-events:none}
.app.compact .sidebar:hover .brand-copy,.app.compact .sidebar:hover .nav-label,.app.compact .sidebar:hover .mode-copy{opacity:1;transform:none;pointer-events:auto}
.nav{display:grid;gap:5px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}

.nav-btn:hover,.mode-btn:hover,.backup-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-btn.active{color:var(--forest-2);background:#f3eddf;box-shadow:0 8px 18px rgba(13,26,19,.17)}
.icon{width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center}.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-label{font-size:12px;font-weight:750;letter-spacing:.01em}
.sidebar-footer{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.11);display:grid;gap:3px}.mode-btn,.backup-btn{height:44px;color:rgba(248,243,233,.64)}.mode-copy{font-size:10px;font-weight:700}
.workspace{min-width:0;overflow:hidden}.page-wrap{width:100%;max-width:1460px;margin:0 auto;padding:32px 36px 70px}

.action-btn::before,.action-menu-btn::before{content:attr(data-tip);position:absolute;right:62px;top:50%;transform:translateY(-50%) translateX(5px);padding:7px 10px;border-radius:8px;color:#fff;background:#27372e;font-size:10px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s ease;box-shadow:0 8px 18px rgba(29,43,34,.18)}
.action-btn:hover::before,.action-menu-btn:hover::before{opacity:1;transform:translateY(-50%)}.action-menu-btn{margin-top:auto;color:#fff;background:var(--olive)}

.tabs{display:flex;gap:6px;margin-bottom:22px;padding:5px;border:1px solid var(--line);border-radius:16px;background:rgba(255,253,248,.85);overflow:auto}.tab{border:0;border-radius:12px;padding:10px 16px;color:var(--muted);background:transparent;font-size:11px;font-weight:780;white-space:nowrap}.tab.active{color:#fff;background:var(--forest)}
.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,253,248,.94);box-shadow:var(--shadow)}.card-pad{padding:22px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.card-head small,.eyebrow{color:var(--olive);font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(520px,1.7fr) minmax(210px,.72fr);gap:22px;align-items:start}.module-stack{display:grid;gap:18px}.module-card{padding:20px;min-height:176px;display:flex;flex-direction:column}.module-icon{width:42px;height:42px;margin-bottom:13px;display:grid;place-items:center;border-radius:13px;color:#fff;background:var(--olive)}.module-icon.dark{background:var(--forest)}.module-icon.gold{color:var(--forest);background:#eadbb8}.module-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.module-card p{margin:7px 0 14px;color:var(--muted);font-size:12px;line-height:1.5}.module-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--forest);font-size:10px;font-weight:800}

/* Detailed task, priority, note and attachment system */

.task-status-badge{color:var(--forest);background:#e4ebe1}.status-pending{color:#5d573f;background:#eee6cf}.status-active{color:#fff;background:var(--forest)}.status-paused{color:#695f55;background:#e8e0d6}.status-completed{color:#fff;background:var(--success)}

.status-split{margin-top:12px}.status-split:first-of-type{margin-top:4px}.status-split + .status-split{padding-top:12px;border-top:1px solid var(--line)}.status-split-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.status-split-head strong{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.status-split-head span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:#eef2eb;color:var(--forest);font-size:10px;font-weight:800}.status-split.completed .status-split-head span{background:#ece8df;color:#7d7567}.status-split-empty{padding:8px 0 2px;color:var(--muted);font-size:10px}.status-split .task-item:last-child{border-bottom:0}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.detail-box{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.detail-box.wide{grid-column:1/-1}.detail-box small{display:block;margin-bottom:5px;color:var(--muted);font-size:8px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.detail-box strong,.detail-box p{margin:0;color:var(--ink);font-size:11px;line-height:1.55;white-space:pre-wrap}.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.checkbox-field{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:11px;font-weight:720}.checkbox-field input{width:17px!important;height:17px;margin:0;flex:0 0 17px;accent-color:var(--forest)}
.attachment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.attachment-card{min-width:0;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none}.attachment-card:hover{border-color:rgba(120,132,102,.55);background:#f5f1e8}.attachment-card img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:7px}.attachment-file-icon{height:70px;display:grid;place-items:center;margin-bottom:7px;border-radius:8px;color:var(--forest);background:#e7eee5;font-weight:850}.attachment-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:750}.attachment-size{display:block;margin-top:3px;color:var(--muted);font-size:8px}

@media(max-width:700px){.detail-grid,.attachment-grid{grid-template-columns:1fr}}

/* Universal record deletion controls */

<script>
(()=>{
'use strict';
const STORE='life-ceo-os-stable-v1';
const LEGACY='jess-life-ceo-planner-v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const sessionGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const sessionSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const safe=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
const dateLabel=(d,opts={weekday:'long',month:'long',day:'numeric'})=>new Intl.DateTimeFormat('en-CA',opts).format(new Date(d+'T12:00:00'));

const AGENDA_START_MINUTES=6*60;
const AGENDA_END_MINUTES=22*60+30;
const AGENDA_SLOT_MINUTES=15;
const AGENDA_SLOT_HEIGHT=24;
function timeToMinutes(value=''){
 const raw=String(value||'').trim();
 if(!raw)return NaN;
 const match=raw.match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?$/i);
 if(!match)return NaN;
 let hour=Number(match[1]),minute=Number(match[2]);
 if(!Number.isFinite(hour)||!Number.isFinite(minute)||minute<0||minute>59)return NaN;
 const period=(match[3]||'').toUpperCase();
 if(period){
  if(hour<1||hour>12)return NaN;
  hour=hour%12+(period==='PM'?12:0);
 }else if(hour<0||hour>23)return NaN;
 return hour*60+minute;
}
function minutesToTime(total){
 const value=Math.max(0,Math.min(1439,Math.round(Number(total)||0)));
 return `${String(Math.floor(value/60)).padStart(2,'0')}:${String(value%60).padStart(2,'0')}`;
}
function formatTime12(value,fallback=''){
 const total=timeToMinutes(value);
 if(!Number.isFinite(total))return fallback;
 const hour24=Math.floor(total/60),minute=total%60,hour12=hour24%12||12;
 return `${hour12}:${String(minute).padStart(2,'0')} ${hour24>=12?'PM':'AM'}`;
}
function timeRange12(start,end){
 const first=formatTime12(start,'Anytime');
 const second=formatTime12(end,'');
 return second?`${first} – ${second}`:first;
}
function eventStartValue(event={}){return event.time||event.start||''}
function eventEndValue(event={}){return event.endTime||event.end||''}
function parseTypedTime(value='',fallbackPeriod='AM'){
 const raw=String(value||'').trim().toUpperCase().replace(/\./g,'').replace(/\s+/g,'');
 if(!raw)return NaN;
 const periodMatch=raw.match(/(AM|PM|A|P)$/);
 const explicitPeriod=periodMatch?(periodMatch[1].startsWith('P')?'PM':'AM'):'';
 let numeric=explicitPeriod?raw.slice(0,-periodMatch[1].length):raw;
 numeric=numeric.replace(/[^0-9:]/g,'');
 let hour,minute=0;
 if(numeric.includes(':')){
  const parts=numeric.split(':');
  hour=Number(parts[0]);
  minute=Number(parts[1]||0)
 }else if(numeric.length<=2){
  hour=Number(numeric)
 }else if(numeric.length===3){
  hour=Number(numeric.slice(0,1));
  minute=Number(numeric.slice(1))
 }else if(numeric.length===4){
  hour=Number(numeric.slice(0,2));
  minute=Number(numeric.slice(2))
 }else return NaN;
 if(!Number.isFinite(hour)||!Number.isFinite(minute)||minute<0||minute>59)return NaN;
 if(explicitPeriod){
  if(hour<1||hour>12)return NaN;
  return (hour%12+(explicitPeriod==='PM'?12:0))*60+minute
 }
 if(hour>12&&hour<=23)return hour*60+minute;
 if(hour<1||hour>12)return NaN;
 const period=String(fallbackPeriod||'AM').toUpperCase()==='PM'?'PM':'AM';
 return (hour%12+(period==='PM'?12:0))*60+minute
}
function setAmPmGroup(group,total){
 if(!group)return false;
 const valid=Number.isFinite(total);
 const hidden=group.querySelector('input[type="hidden"]');
 const text=group.querySelector('[data-time-text]');
 const hourSelect=group.querySelector('[data-time-hour]');
 const minuteSelect=group.querySelector('[data-time-minute]');
 const periodSelect=group.querySelector('[data-time-period]');
 group.classList.toggle('invalid',!valid&&String(text?.value||'').trim()!=='');
 if(!valid){
  if(hidden)hidden.value='';
  return false
 }
 const hour24=Math.floor(total/60),minute=total%60,hour12=hour24%12||12,period=hour24>=12?'PM':'AM';
 if(hidden)hidden.value=minutesToTime(total);
 if(text)text.value=formatTime12(minutesToTime(total));
 if(hourSelect)hourSelect.value=String(hour12);
 if(minuteSelect)minuteSelect.value=String(minute);
 if(periodSelect)periodSelect.value=period;
 return true
}
function ampmTimeField(name,label,required=false,value=''){
 const total=timeToMinutes(value),has=Number.isFinite(total);
 const hour24=has?Math.floor(total/60):0,minute=has?total%60:0,hour12=has?(hour24%12||12):'',period=has&&hour24>=12?'PM':'AM';
 const hours=['<option value="">Hour</option>',...Array.from({length:12},(_,i)=>`<option value="${i+1}" ${Number(hour12)===i+1?'selected':''}>${i+1}</option>`)].join('');
 const minutes=Array.from({length:60},(_,m)=>`<option value="${m}" ${has&&minute===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('');
 return `<div class="field"><label>${safe(label)}</label><div class="time-entry" data-ampm-time>
  <div class="time-entry-main">
   <input class="time-text" data-time-text type="text" value="${has?safe(formatTime12(value)):''}" placeholder="7:30 AM" autocomplete="off" spellcheck="false" ${required?'required':''}>
   <button class="time-picker-toggle" type="button" data-time-picker-toggle>Choose</button>
  </div>
  <div class="time-picker-panel" data-time-picker-panel hidden>
   <select data-time-hour aria-label="${safe(label)} hour">${hours}</select>
   <span class="ampm-colon">:</span>
   <select data-time-minute aria-label="${safe(label)} minute">${minutes}</select>
   <select data-time-period aria-label="${safe(label)} AM or PM"><option value="AM" ${period==='AM'?'selected':''}>AM</option><option value="PM" ${period==='PM'?'selected':''}>PM</option></select>
  </div>
  <input type="hidden" name="${safe(name)}" value="${has?minutesToTime(total):''}">
  <span class="time-entry-help">Type 7:30 AM, 730 PM or 19:30 — or use Choose for the AM/PM selector.</span>
 </div></div>`;
}
function syncAmPmTimeField(group,source='text'){
 if(!group)return true;
 const text=group.querySelector('[data-time-text]');
 const hourSelect=group.querySelector('[data-time-hour]');
 const minuteSelect=group.querySelector('[data-time-minute]');
 const periodSelect=group.querySelector('[data-time-period]');
 if(source==='picker'){
  const hour=Number(hourSelect?.value||0);
  const minute=Number(minuteSelect?.value||0);
  const period=periodSelect?.value||'AM';
  if(!hour){
   const hidden=group.querySelector('input[type="hidden"]');
   if(hidden)hidden.value='';
   if(text)text.value='';
   group.classList.remove('invalid');
   return true
  }
  return setAmPmGroup(group,(hour%12+(period==='PM'?12:0))*60+minute)
 }
 const typed=String(text?.value||'').trim();
 if(!typed){
  const hidden=group.querySelector('input[type="hidden"]');
  if(hidden)hidden.value='';
  group.classList.remove('invalid');
  return true
 }
 const fallback=periodSelect?.value||'AM';
 return setAmPmGroup(group,parseTypedTime(typed,fallback))
}
function bindAmPmTimeFields(scope=document){
 scope.querySelectorAll('[data-ampm-time]').forEach(group=>{
  const text=group.querySelector('[data-time-text]');
  const panel=group.querySelector('[data-time-picker-panel]');
  const toggle=group.querySelector('[data-time-picker-toggle]');
  if(toggle)toggle.onclick=()=>{
   const opening=panel?.hasAttribute('hidden');
   if(panel){
    if(opening)panel.removeAttribute('hidden');
    else panel.setAttribute('hidden','')
   }
   toggle.textContent=opening?'Done':'Choose'
  };
  if(text){
   text.onblur=()=>syncAmPmTimeField(group,'text');
   text.onkeydown=e=>{
    if(e.key==='Enter'){
     e.preventDefault();
     if(syncAmPmTimeField(group,'text'))text.blur()
    }
   };
   text.oninput=()=>group.classList.remove('invalid')
  }
  group.querySelectorAll('[data-time-hour],[data-time-minute],[data-time-period]').forEach(select=>{
   select.onchange=()=>syncAmPmTimeField(group,'picker')
  });
  if(String(text?.value||'').trim())syncAmPmTimeField(group,'text')
 })
}
function arrangeAgendaLanes(events=[]){
 const sorted=[...events].sort((a,b)=>(timeToMinutes(eventStartValue(a))-timeToMinutes(eventStartValue(b)))||(timeToMinutes(eventEndValue(b))-timeToMinutes(eventEndValue(a))));
 const groups=[];let group=[],groupEnd=-1;
 for(const event of sorted){
  const start=timeToMinutes(eventStartValue(event)),end=timeToMinutes(eventEndValue(event));
  if(!group.length||start<groupEnd){group.push(event);groupEnd=Math.max(groupEnd,end)}
  else{groups.push(group);group=[event];groupEnd=end}
 }
 if(group.length)groups.push(group);
 const map=new Map();
 for(const items of groups){
  const laneEnds=[];
  for(const event of items){
   const start=timeToMinutes(eventStartValue(event)),end=timeToMinutes(eventEndValue(event));
   let lane=laneEnds.findIndex(value=>value<=start);
   if(lane<0){lane=laneEnds.length;laneEnds.push(end)}else laneEnds[lane]=end;
   map.set(event.id,{lane,lanes:1});
  }
  const lanes=Math.max(1,laneEnds.length);
  for(const event of items)map.set(event.id,{...(map.get(event.id)||{lane:0}),lanes});
 }
 return map;
}
function agendaTimeline(events=[]){
 const untimed=events.filter(event=>!Number.isFinite(timeToMinutes(eventStartValue(event))));
 const normalized=events.map(event=>{
  const start=timeToMinutes(eventStartValue(event));
  if(!Number.isFinite(start))return null;
  let end=timeToMinutes(eventEndValue(event));
  if(!Number.isFinite(end)||end<=start)end=Math.min(start+60,1439);

function bindAgendaInteractions(){
 const timeline=document.querySelector('.agenda-timeline');
 if(!timeline)return;
 const totalMinutes=AGENDA_END_MINUTES-AGENDA_START_MINUTES;
 const pixelsPerMinute=()=>timeline.getBoundingClientRect().height/totalMinutes;
 const snap=value=>Math.round(value/15)*15;
 document.querySelectorAll('.timeline-event[data-event-id]').forEach(block=>{
  const event=state.events.find(item=>item.id===block.dataset.eventId);
  if(!event)return;
  block.onpointerdown=e=>{
   if(e.button!==undefined&&e.button!==0)return;
   if(e.target.closest('[data-delete-type]'))return;
   const resizing=!!e.target.closest('[data-resize-event]');
   const initialStart=timeToMinutes(event.time);
   let initialEnd=timeToMinutes(event.endTime);
   if(!Number.isFinite(initialStart))return;
   if(!Number.isFinite(initialEnd)||initialEnd<=initialStart)initialEnd=initialStart+60;
   const initialY=e.clientY;
   const initialTop=parseFloat(block.style.top)||0;
   const initialHeight=parseFloat(block.style.height)||38;
   const duration=initialEnd-initialStart;
   let currentStart=initialStart,currentEnd=initialEnd,moved=false;
   block.setPointerCapture?.(e.pointerId);
   block.classList.add(resizing?'is-resizing':'is-moving');
   e.preventDefault();
   const move=moveEvent=>{
    const deltaPixels=moveEvent.clientY-initialY;
    const deltaMinutes=snap(deltaPixels/pixelsPerMinute());
    moved=moved||Math.abs(deltaPixels)>3;
    if(resizing){
     currentStart=initialStart;
     currentEnd=Math.max(initialStart+15,Math.min(AGENDA_END_MINUTES,initialEnd+deltaMinutes));
     block.style.height=`${Math.max(38,(currentEnd-currentStart)*pixelsPerMinute())}px`
    }else{
     currentStart=Math.max(AGENDA_START_MINUTES,Math.min(AGENDA_END_MINUTES-duration,initialStart+deltaMinutes));
     currentEnd=currentStart+duration;
     block.style.top=`${(currentStart-AGENDA_START_MINUTES)*pixelsPerMinute()}px`;
     block.style.height=`${initialHeight}px`
    }
    const timeText=block.querySelector('.timeline-time');
    if(timeText)timeText.textContent=timeRange12(minutesToTime(currentStart),minutesToTime(currentEnd));
    agendaPointerLabel(timeRange12(minutesToTime(currentStart),minutesToTime(currentEnd)),moveEvent.clientX,moveEvent.clientY)
   };
   const finish=()=>{
    block.releasePointerCapture?.(e.pointerId);
    block.classList.remove('is-moving','is-resizing');
    removeAgendaPointerLabel();
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',finish);
    window.removeEventListener('pointercancel',cancel);
    if(moved)persistAgendaEvent(event,currentStart,currentEnd,resizing?'Event duration updated.':'Event time updated.');
    else if(!resizing)openEventEditor(event.id)
   };
   const cancel=()=>{
    block.classList.remove('is-moving','is-resizing');
    block.style.top=`${initialTop}px`;
    block.style.height=`${initialHeight}px`;

function tableCard(headers,rows,emptyText,action){const normalized=rows.map(r=>Array.isArray(r)?{cells:r}:r),hasDelete=normalized.some(r=>r?.deleteType&&r?.id);return `<article class="card card-pad"><div class="card-head"><h3>${route.tab[0].toUpperCase()+route.tab.slice(1)}</h3><button class="text-btn" data-open-action="${action}">Add</button></div>${normalized.length?`<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}${hasDelete?'<th class="table-delete-cell">Delete</th>':''}</tr></thead><tbody>${normalized.map(r=>`<tr>${r.cells.map(c=>`<td>${c??''}</td>`).join('')}${hasDelete?`<td class="table-delete-cell">${r.deleteType&&r.id?deleteIconButton(r.deleteType,r.id,`Delete ${recordLabels[r.deleteType]||'record'}`):''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:`<p class="muted">${emptyText}</p>`}</article>`}

function growthHabits(){const ds=weekDates(),week=habitWeekStats(ds),today=todayHabitStats(),streak=bestHabitStreak(),todayMood=moodForDate(todayISO()),mood=moodInfo(todayMood?.mood);return `<section class="habit-page"><div class="wellbeing-summary-grid"><article class="card wellbeing-stat ring-card"><div><small>Weekly completion</small><strong>${week.percent}%</strong><p>${week.completed} of ${week.target} planned habit check-ins complete.</p></div><div class="progress-ring" style="--value:${week.percent}"><span>${week.percent}%</span></div></article><article class="card wellbeing-stat"><small>Today</small><strong>${today.completed}/${today.total}</strong><p>${today.total?`${today.percent}% of today's habits are complete.`:'Add an active habit to begin.'}</p></article><article class="card wellbeing-stat"><small>Best current streak</small><strong>${streak}</strong><p>${streak===1?'day':streak===0?'Complete a habit today to begin.':'days across your active habits.'}</p></article><article class="card wellbeing-stat"><small>Mood today</small><strong>${mood.emoji} ${safe(mood.label)}</strong><p>${todayMood?.energy?`Energy ${safe(todayMood.energy)}/5 · Stress ${safe(todayMood.stress||'—')}/5`:'Use the mood tracker below for a quick check-in.'}</p></article></div><article class="card habit-card"><div class="card-head"><div><span class="eyebrow">This week</span><h3>Habit tracker</h3><p class="muted" style="margin-top:5px;font-size:14px">Track each habit, its weekly target, completion and current streak.</p></div><button class="text-btn" data-open-action="add-habit">Add habit</button></div><div class="habit-grid"><div></div>${ds.map(d=>`<div class="habit-head">${dateLabel(d,{weekday:'short'})}<span>${new Date(d+'T12:00:00').getDate()}</span></div>`).join('')}${state.habits.map(h=>{const goal=habitTarget(h),done=habitChecksForWeek(h,ds),percent=goal?Math.min(100,Math.round(done/goal*100)):0,streak=habitCurrentStreak(h);return `<div class="habit-name-row"><div class="habit-name"><button data-open-habit="${h.id}">${safe(h.title||h.name)}<small>${safe(h.category||'Habit')} · ${safe(habitFrequencyLabel(h))} · ${goal} per week${String(h.status||'active').toLowerCase()==='paused'?' · Paused':''}</small><span class="habit-mini-progress"><span class="progress"><span style="width:${percent}%"></span></span><span>${done}/${goal} · ${streak} day streak</span></span></button></div>${deleteIconButton('habit',h.id,'Delete habit')}</div>${ds.map(d=>{const allowed=habitAllowedOnDate(h,d),on=state.habitChecks[h.id+'|'+d],isToday=d===todayISO();return `<button class="habit-toggle ${on?'on':''} ${isToday?'today':''}" data-habit="${h.id}" data-date="${d}" ${allowed?'':'disabled'} aria-label="${safe(h.title||h.name)} on ${safe(d)}">${on?'✓':''}</button>`}).join('')}`}).join('')||'<div class="habit-empty">Add a habit to begin tracking completion, targets and streaks.</div>'}</div></article><article class="card mood-card"><div class="card-head"><div><span class="eyebrow">Well-being check-in</span><h3>Mood tracker</h3><p class="muted" style="margin-top:5px;font-size:14px">Track mood, energy, stress and a note without leaving your planner.</p></div><button class="text-btn" data-open-mood-date="${todayISO()}">${todayMood?'Update today':'Log today'}</button></div><div class="mood-layout"><section class="mood-today"><h4>How are you feeling today?</h4><p>Choose a mood now, then add energy, stress or a note when useful.</p><div class="mood-choice-row">${Object.entries(MOOD_SCALE).map(([value,item])=>`<button class="mood-choice ${Number(todayMood?.mood)===Number(value)?'selected':''}" data-mood-value="${value}" data-mood-date="${todayISO()}"><span>${item.emoji}</span><small>${item.label}</small></button>`).join('')}</div><button class="soft-btn mood-detail-btn" data-open-mood-date="${todayISO()}">Add energy, stress and a note</button></section><section class="mood-week">${ds.map(d=>{const entry=moodForDate(d),info=moodInfo(entry?.mood),isToday=d===todayISO();return function categoryRow(kind,name){

  <input class="category-colour-picker" type="color" value="${safe(colour)}" data-category-colour="${safe(kind)}" data-category-name="${safe(name)}" aria-label="Choose colour for ${safe(name)}">
  <input class="category-hex" type="text" value="${safe(colour)}" maxlength="7" data-category-hex="${safe(kind)}" data-category-name="${safe(name)}" aria-label="Hex colour for ${safe(name)}">
  <button type="button" class="category-row-delete" aria-label="Delete ${safe(name)}" title="Delete category" data-category-kind="${safe(kind)}" data-category-remove="${safe(name)}">${svg('trash')}</button>
 </div>`

function categoryList(kind){

function updateCategoryRowPreview(row,colour){
 if(!row)return;
 const value=normalizeHexColor(colour);
 row.style.setProperty('--category-color',value);
 row.style.setProperty('--category-soft',mixHex(value,'#FFFFFF',.88));
 const picker=row.querySelector('[data-category-colour]');
 const hex=row.querySelector('[data-category-hex]');
 if(picker&&picker.value.toUpperCase()!==value)picker.value=value;
 if(hex&&hex.value.toUpperCase()!==value)hex.value=value
}
function bindCategoryColourControls(){
 document.querySelectorAll('#drawer [data-category-colour]').forEach(input=>{
  const row=input.closest('[data-category-row]');
  const kind=input.dataset.categoryColour,name=input.dataset.categoryName;
  input.oninput=()=>{
   const colour=normalizeHexColor(input.value);
   setCategoryColor(kind,name,colour,false);
   updateCategoryRowPreview(row,colour)
  };
  input.onchange=()=>{
   setCategoryColor(kind,name,input.value,true);
   updateCategoryRowPreview(row,input.value);
   showToast(`${name} colour updated.`)
  }
 });
 document.querySelectorAll('#drawer [data-category-hex]').forEach(input=>{
  const row=input.closest('[data-category-row]');
  const kind=input.dataset.categoryHex,name=input.dataset.categoryName;
  const apply=persist=>{
   const value=normalizeHexColor(input.value,'');
   if(!isHexColor(value)){input.setAttribute('aria-invalid','true');return false}
   input.removeAttribute('aria-invalid');
   setCategoryColor(kind,name,value,persist);
   updateCategoryRowPreview(row,value);
   if(persist)showToast(`${name} colour updated.`);
   return true
  };
  input.oninput=()=>{if(isHexColor(normalizeHexColor(input.value,'')))apply(false)};
  input.onblur=()=>apply(true);
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(apply(true))input.blur()}}
 })
}

function openTaskEditor(id){const t=state.tasks.find(x=>x.id===id);if(t)openDrawer('Edit task','Update the task details below.',taskForm('Edit task',t,false).html)}
function openNoteDetail(id){const n=state.notes.find(x=>x.id===id);if(!n)return;openDrawer(n.title||'Note',`${safe(n.type||'Note')} · ${safe(n.status||'pending')}`,`<div class="detail-grid">${detailBox('Note date',n.date)}${detailBox('Status',n.status||'pending')}${detailBox('Related to',n.relatedTo)}${detailBox('Contact',n.contact)}${detailBox('Follow-up date',n.followUpDate)}${detailBox('Follow-up time',n.followUpDate?(n.followUpTime?formatTime12(n.followUpTime):'Start of day'):'')}${detailBox('Category',n.category)}${detailBox('Next action',n.nextAction,true)}${detailBox('Tags / attendees',n.tags,true)}${detailBox('Full note',n.body||n.text,true)}<div class="detail-box wide"><small>Attachments</small>${attachmentsHTML(n.attachments,'note',n.id)}</div></div><div class="detail-actions"><button class="primary-btn" data-edit-note="${n.id}">Edit note</button>${n.linkedTaskId?'<span class="meta-pill">Linked task created</span>':''}<button class="danger-btn" data-delete-type="note" data-delete-id="${n.id}">${svg('trash')} Delete note</button></div><p class="delete-note">A linked follow-up task will be removed with this note.</p>`)}
function openNoteEditor(id){const n=state.notes.find(x=>x.id===id);if(n)openDrawer('Edit note or follow-up','Update the complete record below.',noteForm('Edit note or follow-up',n,'').html)}
function readDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('A file could not be read.'));reader.readAsDataURL(file)})}
function loadImage(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('An image could not be processed.'));image.src=url})}
async function fileAttachment(file){let dataUrl;if(String(file.type||'').startsWith('image/')){const original=await readDataUrl(file);const image=await loadImage(original);const max=1100,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);dataUrl=canvas.toDataURL('image/jpeg',.68)}else{if(file.size>350*1024)throw new Error(`${file.name} is too large. Non-image files must be under 350 KB.`);dataUrl=await readDataUrl(file)}return{id:uid(),name:file.name,type:file.type||'application/octet-stream',size:file.size,dataUrl}}
async function collectAttachments(form){const input=form.querySelector('input[type="file"][name="attachments"]'),files=input?[...input.files]:[];if(files.length>3)throw new Error('Please choose no more than 3 attachments.');const items=[];for(const file of files)items.push(await fileAttachment(file));if(items.reduce((s,a)=>s+String(a.dataUrl||'').length,0)>1800000)throw new Error('These attachments are too large for browser storage. Please use smaller files.');return items}
async function handleForm(e){e.preventDefault();const form=e.currentTarget,type=form.dataset.formType,button=form.querySelector('[type="submit"]');button?.classList.add('form-saving');const before=JSON.stringify(state);try{form.querySelectorAll('[data-ampm-time]').forEach(group=>{if(!syncAmPmTimeField(group,'text'))throw new Error('Enter a valid time such as 7:30 AM.')});const fd=new FormData(form),data={};for(const[k,v]of fd.entries())if(!(v instanceof File))data[k]=v;const categoryLibrary=data.__categoryLibrary,editId=data.__editId;delete data.__categoryLibrary;delete data.__editId;const newAttachments=await collectAttachments(form);if(categoryLibrary&&data.category)addCategory(categoryLibrary,data.category,false,seededCategoryColor(data.category,categoryLibrary));if(type==='opening'){state.settings.openingBalance=Number(data.openingBalance||0)}else{const key={event:'events',task:'tasks',transaction:'transactions',project:'projects',client:'clients',quote:'quotes',recurring:'recurring',content:'content',goal:'goals',habit:'habits',mood:'moods',reset:'resets',note:'notes',routine:'routines'}[type];if(!key)return;let existing=editId?state[key].find(x=>x.id===editId):null;if(type==='mood'&&!existing)existing=state.moods.find(x=>x.date===data.date);data.id=existing?.id||uid();data.attachments=[...(Array.isArray(existing?.attachments)?existing.attachments:[]),...newAttachments];if(type==='event'){const start=timeToMinutes(data.time),end=timeToMinutes(data.endTime);if(data.endTime&&!Number.isFinite(start))throw new Error('Choose a start time before adding an end time.');if(Number.isFinite(start)&&!Number.isFinite(end))data.endTime=minutesToTime(Math.min(start+60,1439));if(Number.isFinite(start)&&Number.isFinite(timeToMinutes(data.endTime))&&timeToMinutes(data.endTime)<=start)throw new Error('The end time must be later than the start time.');}if(type==='task'){data.isTopPriority=String(data.isTopPriority)==='true'||form.querySelector('[name="isTopPriority"]')?.checked===true;data.priority=taskPriority(data);data.status=taskStatus(data);data.done=data.status==='completed';if(data.done)data.completedAt=existing?.completedAt||new Date().toISOString();else data.completedAt='';for(const k of ['estimatedMinutes'])if(data[k]!==undefined&&data[k]!=='')data[k]=Number(data[k])}const createTask=type==='note'&&form.querySelector('[name="createTask"]')?.checked===true;if(type==='note'){data.status=String(data.status||'pending').toLowerCase();if(createTask&&!existing?.linkedTaskId){const linked={id:uid(),title:`Follow up: ${data.title}`,description:data.nextAction||String(data.body||'').slice(0,300),date:data.followUpDate||data.date,time:data.followUpTime||'',priority:'medium',status:'pending',done:false,category:'Follow-up',relatedTo:data.relatedTo||'',isTopPriority:false,linkedNoteId:data.id,attachments:[]};state.tasks.push(linked);data.linkedTaskId=linked.id}else if(existing?.linkedTaskId){data.linkedTaskId=existing.linkedTaskId;const linked=state.tasks.find(t=>t.id===existing.linkedTaskId);if(linked&&!taskIsComplete(linked)){linked.title=`Follow up: ${data.title}`;linked.description=data.nextAction||String(data.body||'').slice(0,300);linked.date=data.followUpDate||data.date;linked.time=data.followUpTime||'';linked.relatedTo=data.relatedTo||''}}}if(type==='habit'){data.status=String(data.status||'active').toLowerCase();if(data.weeklyTarget!=='')data.weeklyTarget=Math.min(7,Math.max(1,Number(data.weeklyTarget)||habitTarget(data)));else data.weeklyTarget=''}if(type==='mood'){data.mood=Number(data.mood||3);data.energy=data.energy?Number(data.energy):'';data.stress=data.stress?Number(data.stress):'';data.updatedAt=new Date().toISOString()}for(const k of ['amount','progress','reach','engagement'])if(data[k]!==undefined&&data[k]!=='')data[k]=Number(data[k]);if(existing)Object.assign(existing,data);else state[key].push(data)}localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();showToast(editId?'Updated.':'Saved.');render()}catch(err){try{state=JSON.parse(before)}catch(e){}showToast(err?.message||'This record could not be saved.');button?.classList.remove('form-saving')}}
function openBackup(){openDrawer('Backup & restore','Your planner stays in this browser. Download a backup before replacing files or clearing browser data.',`<div class="action-menu-grid"><button class="menu-action" id="exportBackup"><span class="icon-box">${svg('download')}</span><span><strong>Download backup</strong><small>Save all planner data as a JSON file.</small></span><span>›</span></button><button class="menu-action" data-import><span class="icon-box">${svg('upload')}</span><span><strong>Restore backup</strong><small>Import a backup file from this planner.</small></span><span>›</span></button><input id="backupFile" type="file" accept="application/json" hidden><button class="menu-action" id="legacyImport"><span class="icon-box">${svg('repeat')}</span><span><strong>Try legacy import again</strong><small>Copy compatible records from the original planner storage.</small></span><span>›</span></button></div>`);document.getElementById('exportBackup').onclick=exportBackup;document.getElementById('legacyImport').onclick=()=>{state.migrated=false;migrateLegacy(state);state.migrated=true;localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();render();showToast('Legacy import completed.')}}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`life-ceo-os-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=JSON.parse(reader.result);if(!next||typeof next!=='object')throw new Error('Invalid');state=Object.assign(defaults(),next);normalizeCategoryLibraries(state);if(!Array.isArray(state.moods))state.moods=[];localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();applyNav();render();showToast('Backup restored.')}catch(err){showToast('That backup file could not be read.')}};reader.readAsText(file)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
init();
})();
