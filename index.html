<style>

function normalizeCategoryLibraries(s){const base=defaultCategoryLibraries();if(!s.categoryLibraries||typeof s.categoryLibraries!=='object')s.categoryLibraries={};for(const[k,items]of Object.entries(base)){const existing=Array.isArray(s.categoryLibraries[k])?s.categoryLibraries[k]:[];s.categoryLibraries[k]=[...new Set([...items,...existing].map(x=>String(x||'').trim()).filter(Boolean))]}return s}

function migrateLegacy(s){let old;try{old=JSON.parse(localStorage.getItem(LEGACY))}catch(e){}if(!old||typeof old!=='object')return;const find=(obj,names)=>{for(const n of names)if(Array.isArray(obj[n]))return obj[n];for(const v of Object.values(obj))if(v&&typeof v==='object'&&!Array.isArray(v)){const f=find(v,names);if(f)return f}return null};const map={tasks:['tasks','todo','todos'],events:['events','agenda','appointments'],projects:['projects'],clients:['clients'],quotes:['quotes','estimates'],transactions:['transactions','financeTransactions'],recurring:['recurring','commitments'],content:['content','posts','socialPosts'],goals:['goals'],habits:['habits'],notes:['notes','journalEntries'],routines:['routines']};for(const[k,names]of Object.entries(map)){const arr=find(old,names);if(arr&&arr.length)s[k]=arr.map(x=>Object.assign({id:uid()},x))}}

function init(){parseHash();buildNav();document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=svg(el.dataset.icon));document.getElementById('actionMenuButton').innerHTML=svg('menu');document.getElementById('modeButton').onclick=toggleNav;document.getElementById('backupButton').onclick=openBackup;document.getElementById('drawerClose').onclick=closeDrawer;document.getElementById('drawerBackdrop').onclick=closeDrawer;window.addEventListener('hashchange',()=>{parseHash();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});applyNav();render();setInterval(updateClock,30000)}
function buildNav(){document.getElementById('mainNav').innerHTML=Object.entries(areas).map(([k,a])=>`<button class="nav-btn" data-area="${k}"><span class="icon">${svg(a.icon)}</span><span class="nav-label">${a.label}</span></button>`).join('');document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setRoute(b.dataset.area))}

function hero(title,subtitle,kicker='Your connected workspace'){return `<section class="hero"><span class="kicker">${safe(kicker)}</span><h1>${title}</h1><p>${safe(subtitle)}</p><div class="hero-date"><strong>${dateLabel(todayISO(),{month:'long',day:'numeric'})}</strong><small>${new Date().getFullYear()} ${dateLabel(todayISO(),{weekday:'long'})}</small></div></section>`}
function tabs(){const a=areas[route.area];if(!a.tabs)return'';return `<div class="tabs">${a.tabs.map(([k,l])=>`<button class="tab ${route.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</div>`}

function bindPage(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setRoute(route.area,b.dataset.tab));document.querySelectorAll('[data-area-link]').forEach(b=>b.onclick=()=>setRoute(b.dataset.areaLink));document.querySelectorAll('[data-open-action]').forEach(b=>b.onclick=()=>openAction(b.dataset.openAction));document.querySelectorAll('[data-toggle-task]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.toggleTask));document.querySelectorAll('[data-open-task]').forEach(b=>b.onclick=()=>openTaskDetail(b.dataset.openTask));document.querySelectorAll('[data-open-note]').forEach(b=>b.onclick=()=>openNoteDetail(b.dataset.openNote));document.querySelectorAll('[data-delete-type]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();deleteRecord(b.dataset.deleteType,b.dataset.deleteId)});document.querySelectorAll('[data-remove-attachment]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();removeAttachment(b.dataset.ownerType,b.dataset.ownerId,b.dataset.removeAttachment)});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{const key=b.dataset.habit+'|'+b.dataset.date;state.habitChecks[key]=!state.habitChecks[key];save()});const date=document.getElementById('planDate');if(date)date.onchange=()=>{sessionSet('plan-date',date.value);render()}}
function updateClock(){const el=document.querySelector('[data-clock]');if(el)el.textContent=new Intl.DateTimeFormat('en-CA',{hour:'numeric',minute:'2-digit'}).format(new Date())}
function currentPlanDate(){return sessionGet('plan-date')||todayISO()}
function byDate(arr,d){return arr.filter(x=>(x.date||x.dueDate||x.scheduledDate||'')===d)}
function taskPriority(t){const p=String(t?.priority||'').toLowerCase();return ['low','medium','high','critical'].includes(p)?p:(p==='top'?'high':'medium')}
function taskStatus(t){const s=String(t?.status||'').toLowerCase();if(t?.done||s==='completed'||s==='complete')return'completed';if(s==='waiting'||s==='paused')return'paused';if(s==='active'||s==='in-progress'||s==='in progress')return'active';return'pending'}
function taskIsComplete(t){return taskStatus(t)==='completed'}
function taskIsTop(t){return t?.isTopPriority===true||String(t?.isTopPriority)==='true'||String(t?.priority).toLowerCase()==='top'}
function taskTimeLabel(t){return t?.time?safe(t.time):'Start of day'}
function taskSort(a,b){const ta=a.time||'00:00',tb=b.time||'00:00';if(ta!==tb)return ta.localeCompare(tb);const rank={critical:0,high:1,medium:2,low:3};return(rank[taskPriority(a)]??2)-(rank[taskPriority(b)]??2)}
function tasksForDate(d){return state.tasks.filter(t=>!taskIsComplete(t)&&((t.date||t.dueDate)===d||(!t.date&&!t.dueDate))).sort(taskSort)}
function topTasks(d=todayISO()){return state.tasks.filter(t=>!taskIsComplete(t)&&taskIsTop(t)&&(((t.date||t.dueDate)===d)||(!t.date&&!t.dueDate))).sort(taskSort).slice(0,5)}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const completing=!taskIsComplete(t);if(completing){t.previousStatus=taskStatus(t)==='completed'?'active':taskStatus(t);t.status='completed';t.done=true;t.completedAt=new Date().toISOString()}else{t.status=t.previousStatus&&t.previousStatus!=='completed'?t.previousStatus:'active';t.done=false;t.completedAt=''}save()}
function monthTransactions(){const m=todayISO().slice(0,7);return state.transactions.filter(t=>(t.date||'').slice(0,7)===m)}
function balance(){return Number(state.settings.openingBalance||0)+state.transactions.reduce((s,t)=>s+(t.type==='income'?Number(t.amount||0):-Number(t.amount||0)),0)}
function monthNet(){return monthTransactions().reduce((s,t)=>s+(t.type==='income'?Number(t.amount||0):-Number(t.amount||0)),0)}
function renderHome(){const today=todayISO(),events=byDate(state.events,today).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),tasks=topTasks(today),m=monthTransactions(),income=m.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById('page').innerHTML=`${hero('Good morning, Jess.','Your life, business, money and ideas — brought into one clear home hub.','Everything stays connected')}<section class="home-grid"><div class="module-stack">${moduleCard('Planning','plan','Plan your days, weeks and goals.',`${events.length} agenda items today`,'plan')} ${moduleCard('Work','work','Keep tasks, projects and business work moving.',`${state.tasks.filter(x=>!taskIsComplete(x)).length} open tasks`,'work')} ${moduleCard('Growth','growth','Build habits and goals that support the bigger picture.',`${state.goals.length} goals`,'growth','gold')}</div><article class="card glance"><div class="glance-top"><div><span class="eyebrow">Your connected dashboard</span><h2>Today at a glance</h2><p class="muted">Small daily actions create big life changes.</p></div><div class="clock"><strong data-clock></strong><small>${dateLabel(today,{weekday:'long'})}</small></div></div><div class="glance-panels"><section class="inner-panel"><h3>Today's schedule</h3>${events.length?`<div class="list">${events.map(eventRow).join('')}</div>`:empty('Your schedule is open.','Add a time block when you are ready.','add-event')}</section><section class="inner-panel"><h3>Top priorities</h3>${tasks.length?tasks.map(taskRow).join(''):empty('No top priorities yet.','Keep this space for what truly matters.','add-priority')}</section></div><div class="kpis"><div class="kpi"><small>Current balance</small><strong>${money(balance())}</strong></div><div class="kpi"><small>Month net</small><strong>${money(monthNet())}</strong></div><div class="kpi"><small>Active projects</small><strong>${state.projects.filter(x=>x.status!=='complete').length}</strong></div></div></article><div class="module-stack right">${moduleCard('Notes','notes','Capture thoughts, meetings and journal entries.',`${state.notes.length} saved notes`,'notes')} ${moduleCard('Money','money','Track cash flow with clarity and confidence.',`${money(income)} income this month`,'money','dark')} ${moduleCard('Content','content','Plan posts, campaigns and performance.',`${state.content.filter(x=>x.status!=='published').length} planned items`,'content','gold')}</div></section>`}
function moduleCard(title,icon,desc,status,area,style=''){return `<article class="card module-card"><div class="module-icon ${style}">${svg(icon)}</div><h3>${title}</h3><p>${desc}</p><div class="module-foot"><span>${safe(status)}</span><button class="text-btn" data-area-link="${area}">Open →</button></div></article>`}

function taskRow(t){const priority=taskPriority(t),status=taskStatus(t),related=t.relatedTo||t.project||t.client||t.category||'',when=(t.date||t.dueDate)?`${safe(t.date||t.dueDate)} · ${taskTimeLabel(t)}`:taskTimeLabel(t);return `<div class="task-item ${status==='completed'?'completed':''}"><button class="check ${status==='completed'?'done':''}" data-toggle-task="${t.id}" aria-label="${status==='completed'?'Reopen':'Complete'} task">${status==='completed'?'✓':''}</button><button class="task-open" data-open-task="${t.id}"><div class="row-title">${safe(t.title||t.name||'Task')}</div><div class="meta-pills"><span class="priority-badge priority-${priority}">${safe(priority)}</span><span class="task-status-badge status-${status}">${safe(status)}</span><span class="meta-pill">${when}</span>${taskIsTop(t)?'<span class="meta-pill">Top priority</span>':''}</div>${related?`<div class="row-meta">${safe(related)}</div>`:''}${t.description?`<div class="task-description">${safe(t.description)}</div>`:''}</button>${deleteIconButton('task',t.id,'Delete task')}</div>`}
function noteRow(n){const follow=n.followUpDate?`${safe(n.followUpDate)}${n.followUpTime?' · '+safe(n.followUpTime):' · Start of day'}`:'',status=String(n.status||'pending').toLowerCase();return `<div class="note-item"><button class="note-open" data-open-note="${n.id}"><div class="row-title">${safe(n.title||'Note')}</div><div class="meta-pills"><span class="meta-pill">${safe(n.type||'note')}</span>${n.category?`<span class="meta-pill">${safe(n.category)}</span>`:''}${follow?`<span class="task-status-badge status-${status==='completed'?'completed':status==='paused'?'paused':status==='active'?'active':'pending'}">Follow-up ${follow}</span>`:''}</div>${n.relatedTo?`<div class="row-meta">${safe(n.relatedTo)}</div>`:''}<div class="task-description">${safe((n.body||n.nextAction||'').slice(0,140))}</div></button>${deleteIconButton('note',n.id,'Delete note or follow-up')}</div>`}
function empty(title,subtitle,action){return `<div class="empty"><div><strong>${title}</strong><span>${subtitle}</span><br><button class="text-btn" data-open-action="${action}">Add one now →</button></div></div>`}

function renderDay(){const d=currentPlanDate(),events=byDate(state.events,d).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),allTasks=tasksForDate(d),priorities=allTasks.filter(taskIsTop).slice(0,3),flexible=allTasks.filter(t=>!taskIsTop(t)).slice(0,8),notes=state.notes.filter(n=>n.date===d||n.followUpDate===d).sort((a,b)=>(a.followUpTime||'00:00').localeCompare(b.followUpTime||'00:00')).slice(0,5);let hours='';for(let h=6;h<=22;h++){const hh=String(h).padStart(2,'0'),label=new Intl.DateTimeFormat('en-CA',{hour:'numeric'}).format(new Date(`2020-01-01T${hh}:00`));const es=events.filter(e=>(e.time||'').slice(0,2)===hh);hours+=`<div class="hour-row"><div class="hour-label">${label}</div><div class="hour-slot">${es.map(e=>`<div class="event-block"><strong>${safe(e.title||'Event')}</strong><small>${safe(e.time||'')} ${e.endTime?'– '+safe(e.endTime):''}</small>${deleteIconButton('event',e.id,'Delete event')}</div>`).join('')}</div></div>`}return `<section class="agenda-layout"><article class="card agenda-card"><div class="agenda-toolbar"><div><span class="eyebrow">${dateLabel(d,{weekday:'long',month:'long',day:'numeric'})}</span><h3>Schedule</h3></div><input class="date-input" id="planDate" type="date" value="${d}"></div><div class="agenda">${hours}</div></article><aside class="side-stack"><article class="card card-pad"><div class="card-head"><div><span class="eyebrow">Most important</span><h3>Top priorities</h3></div><button class="text-btn" data-open-action="add-priority">Add</button></div>${priorities.map(taskRow).join('')||empty('No priorities yet.','Create a dated priority with urgency and status.','add-priority')}</article><article class="card card-pad"><div class="card-head"><div><span class="eyebrow">Flexible</span><h3>Tasks</h3></div><button class="text-btn" data-open-action="add-task">Add</button></div>${flexible.map(taskRow).join('')||empty('No tasks for this day.','Add a detailed task; no time means start of day.','add-task')}</article><article class="card function startOfWeek(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x}
function renderWeek(){const start=startOfWeek(new Date(currentPlanDate()+'T12:00:00'));const days=Array.from({length:7},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x.toISOString().slice(0,10)});return `<div class="grid grid-2" style="margin-bottom:18px"><article class="card card-pad"><span class="eyebrow">This week</span><h3>Weekly focus</h3><p class="muted">Choose one outcome that keeps the week centred.</p></article><article class="card card-pad"><span class="eyebrow">Top priorities</span><h3>What must move forward</h3>${topTasks().slice(0,3).map(taskRow).join('')||'<p class="muted">Add your top priorities from the Action Menu.</p>'}</article></div><div class="week-grid">${days.map(d=>{const es=byDate(state.events,d),ts=state.tasks.filter(t=>!taskIsComplete(t)&&(t.date===d||t.dueDate===d)),cs=state.content.filter(c=>c.date===d||c.scheduledDate===d);return `<article class="day-card ${d===todayISO()?'today':''}"><div class="day-title"><strong>${dateLabel(d,{weekday:'short'})}</strong><span>${dateLabel(d,{month:'short',day:'numeric'})}</span></div>${es.map(e=>`<div class="mini-entry">${safe(e.time||'Anytime')} ${safe(e.title||'Event')}${deleteIconButton('event',e.id,'Delete event')}</div>`).join('')}${ts.map(t=>`<div class="mini-entry task">□ ${safe(t.title||'Task')}${deleteIconButton('task',t.id,'Delete task')}</div>`).join('')}${cs.map(c=>`<div class="mini-entry content">✦ ${safe(c.title||'Content')}${deleteIconButton('content',c.id,'Delete content item')}</div>`).join('')||(!es.length&&!ts.length&&!cs.length?'<p class="muted" style="font-size:10px">Open space</p>':'')}</article>`}).join('')}</div>`}
function monthDays(value){const base=new Date((value||todayISO()).slice(0,7)+'-01T12:00:00'),first=startOfWeek(base),days=[];for(let i=0;i<42;i++){const x=new Date(first);x.setDate(first.getDate()+i);days.push(x.toISOString().slice(0,10))}return{base,days}}

ss="eyebrow">Important dates</span><h3>Coming up</h3>${state.events.filter(e=>e.date?.slice(0,7)===month).slice(0,6).map(eventRow).join('')||'<p class="muted">No important dates yet.</p>'}</article></aside></section>`}

'add-goal':form('goal','Add goal',[['title','Goal','text',true],['category','Category','select',false,'Business',[['Business','Business'],['Financial','Financial'],['Personal','Personal'],['Health','Health'],['Home','Home']]],['dueDate','Target date','date'],['progress','Progress %','number'],['nextStep','Next step','textarea']]),
'add-habit':form('habit','Add habit',[['title','Habit','text',true],['category','Category','category',true,'Health','habits'],['frequency','Frequency','select',false,'daily',[['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly']]]],{__categoryLibrary:'habits'}),
'add-reset':form('reset','Monthly reset',[['title','Title','text',false,'Monthly reset'],['month','Month','month',false,todayISO().slice(0,7)],['wins','Wins','textarea'],['lessons','Lessons','textarea'],['focus','Next focus','textarea']]),
'add-note':noteForm('New note or follow-up'),
'add-meeting':noteForm('Meeting note',{},'meeting'),
'add-routine':form('routine','Add routine',[['title','Routine name','text',true],['frequency','Frequency','select',false,'daily',[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']]],['details','Steps / details','textarea']])};
const f=forms[id];if(f)openDrawer(f.title,'Complete the details below.',f.html);else showToast('That action is not connected yet.')}
function categoryChips(kind){const list=categories(kind);return list.length?`<div class="category-chips">${list.map(name=>`<span class="category-chip">${safe(name)}<button type="button" aria-label="Remove ${safe(name)}" data-category-kind="${safe(kind)}" data-category-remove="${safe(name)}">×</button></span>`).join('')}</div>`:'<div class="category-empty">No saved categories yet.</div>'}
function categorySection(kind,focus){const[label,description]=categoryLibraryLabels[kind];return `<section class="category-section" id="category-${safe(kind)}"><div class="category-section-head"><div><h3>${safe(label)}</h3><p>${safe(description)}</p></div><button type="button" class="category-reset" data-category-reset="${safe(kind)}">Reset defaults</button></div><div class="category-add-row"><input type="text" placeholder="Add a new category" data-category-input="${safe(kind)}" autocomplete="off"><button type="button" class="primary-btn" data-category-add="${safe(kind)}">Add</button></div>${categoryChips(kind)}</section>`}
function categoryLibraryHTML(focus='planning'){return `<div class="category-library">${['planning','notes','income','expense','habits'].map(kind=>categorySection(kind,focus)).join('')}</div>`}
function openCategoryLibrary(focus='planning'){openDrawer('Category library','Choose from these categories in forms, or type a new one and it will be saved automatically.',categoryLibraryHTML(focus));setTimeout(()=>document.getElementById(`category-${focus}`)?.scrollIntoView({block:'start'}),40)}
function addCategoryFromDrawer(kind){const input=document.querySelector(`#drawer [data-category-input="${kind}"]`);if(!input)return;const value=input.value.trim();if(!value)return;if(addCategory(kind,value)){openCategoryLibrary(kind);showToast('Category added.')}else{input.focus();showToast('That category is already in the library.')}}
function form(type,title,fields,hidden={}){const editId=hidden.__editId||'',deleteControl=editId&&recordCollections[type]?`<button type="button" class="danger-btn" data-delete-type="${safe(type)}" data-delete-id="${safe(editId)}">${svg('trash')} Delete</button>`:'';const html=`<form data-form-type="${type}">${Object.entries(hidden).map(([k,v])=>`<input type="hidden" name="${k}" value="${safe(v)}">`).join('')}<div class="form-grid">${fields.map(([n,l,t,req,val,opts])=>field(n,l,t,req,val,opts)).join('')}<div class="form-actions">${deleteControl}<button type="button" class="soft-btn" onclick="document.getElementById('drawerClose').click()">Cancel</button><button class="primary-btn" type="submit">Save</button></div></div></form>`;return{title,html}}
function field(n,l,t='text',req=false,val='',opts=[]){
 if(t==='textarea')return `<div class="field"><label>${l}</label><textarea name="${n}" ${req?'required':''}>${safe(val)}</textarea></div>`;
 if(t==='select')return `<div class="field"><label>${l}</label><select name="${n}" ${req?'required':''}>${opts.map(([v,x])=>`<option value="${safe(v)}" ${String(v)===String(val)?'selected':''}>${safe(x)}</option>`).join('')}</select></div>`;
 if(t==='category'){const kind=String(opts||'planning'),current=String(val||'').trim(),list=categories(kind).slice();if(current&&!list.some(x=>x.toLowerCase()===current.toLowerCase()))list.unshift(current);const libraryName=(categoryLibraryLabels[kind]?.[0]||'Category').replace('&','and');return `<div class="field"><label>${l}</label><select name="${n}" ${req?'required':''} data-category-kind="${safe(kind)}">${list.map(x=>`<option value="${safe(x)}" ${x===current?'selected':''}>${safe(x)}</option>`).join('')}</select><span class="field-help">Choose from your ${safe(libraryName)} library. Add or remove options from Category Library in the Action Menu.</span></div>`}
 if(t==='checkbox'){const checked=val===true||String(val)==='true'||String(val)==='on';return `<label class="checkbox-field"><input name="${n}" type="checkbox" value="true" ${checked?'checked':''}><span>${safe(l)}</span></label>`}
 if(t==='file')return `<div class="field"><label>${l}</label><input name="${n}" type="file" multiple accept="${safe(opts||'')}"><span class="field-help">Up to 3 attachments. Images are resized for this browser-based planner; other files must be under 350 KB each.</span></div>`;
 return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${safe(val)}" ${t==='number'?'step="1" min="0"':''} ${req?'required':''}></div>`
}
function attachmentHref(a){return a&&typeof a.dataUrl==='string'&&/^data:(image\/[a-z0-9.+-]+|application\/[a-z0-9.+-]+|text\/[a-z0-9.+-]+);/i.test(a.dataUrl)?a.dataUrl:'#'}
function attachmentsHTML(items=[],ownerType='',ownerId=''){if(!Array.isArray(items)||!items.length)return'<p class="muted">No attachments.</p>';return `<div class="attachment-grid">${items.map(a=>{const href=attachmentHref(a),image=String(a.type||'').startsWith('image/')&&href!=='#';return `<div class="attachment-item"><a class="attachment-card" href="${safe(href)}" download="${safe(a.name||'attachment')}">${image?`<img src="${safe(href)}" alt="${safe(a.name||'Attachment')}">`:'<div class="attachment-file-icon">FILE</div>'}<span class="attachment-name">${safe(a.name||'Attachment')}</span><span class="attachment-size">${Math.round(Number(a.size||0)/1024)} KB</span></a>${ownerType&&ownerId?`<button type="button" class="attachment-remove" data-owner-type="${safe(ownerType)}" data-owner-id="${safe(ownerId)}" data-remove-attachment="${safe(a.id)}" aria-label="Remove ${safe(a.name||'attachment')}">${svg('trash')}</button>`:''}</div>`}).join('')}</div>`}
function detailBox(label,value,wide=false){return `<div class="detail-box ${wide?'wide':''}"><small>${safe(label)}</small>${wide?`<p>${safe(value||'—')}</p>`:`<strong>${safe(value||'—')}</strong>`}</div>`}
function openTaskDetail(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const status=taskStatus(t),priority=taskPriority(t);openDrawer(t.title||'Task',`${priority.toUpperCase()} priority · ${status.toUpperCase()}`,`<div class="meta-pills"><span class="priority-badge priority-${priority}">${priority}</span><span class="task-status-badge status-${status}">${status}</span>${taskIsTop(t)?'<span class="meta-pill">Top priority</span>':''}</div><div class="detail-grid">${detailBox('Date',t.date||t.dueDate||'No date')}${detailBox('Time',t.time||'Start of day')}${detailBox('Category',t.category)}${detailBox('Related to',t.relatedTo||t.project||t.client)}${detailBox('Assigned to',t.assignee)}${detailBox('Estimated time',t.estimatedMinutes?`${t.estimatedMinutes} minutes`:'')}${detailBox('Tags',t.tags,true)}${detailBox('Task details',t.description,true)}<div class="detail-box wide"><small>Attachments</small>${attachmentsHTML(t.attachments,'task',t.id)}</div></div><div class="detail-actions"><button class="primary-btn" data-edit-task="${t.id}">Edit task</button><button class="soft-btn" data-toggle-task="${t.id}">${status==='completed'?'Reopen task':'Mark completed'}</button><button class="danger-btn" data-delete-type="task" data-delete-id="${t.id}">${svg('trash')} Delete task</button></div><p class="delete-note">Deleting a task permanently removes it from every planner view.</p>`)}
function openTaskEditor(id){const t=state.tasks.find(x=>x.id===id);if(t)openDrawer('Edit task','Update the task details below.',taskForm('Edit task',t,false).html)}
function openNoteDetail(id){const n=state.notes.find(x=>x.id===id);if(!n)return;openDrawer(n.title||'Note',`${safe(n.type||'Note')} · ${safe(n.status||'pending')}`,`<div class="detail-grid">${detailBox('Note date',n.date)}${detailBox('Status',n.status||'pending')}${detailBox('Related to',n.relatedTo)}${detailBox('Contact',n.contact)}${detailBox('Follow-up date',n.followUpDate)}${detailBox('Follow-up time',n.followUpDate?(n.followUpTime||'Start of day'):'')}${detailBox('Category',n.category)}${detailBox('Next action',n.nextAction,true)}${detailBox('Tags / attendees',n.tags,true)}${detailBox('Full note',n.body||n.text,true)}<div class="detail-box wide"><small>Attachments</small>${attachmentsHTML(n.attachments,'note',n.id)}</div></div><div class="detail-actions"><button class="primary-btn" data-edit-note="${n.id}">Edit note</button>${n.linkedTaskId?'<span class="meta-pill">Linked task created</span>':''}<button class="danger-btn" data-delete-type="note" data-delete-id="${n.id}">${svg('trash')} Delete note</button></div><p class="delete-note">A linked follow-up task will be removed with this note.</p>`)}
function openNoteEditor(id){const n=state.notes.find(x=>x.id===id);if(n)openDrawer('Edit note or follow-up','Update the complete record below.',noteForm('Edit note or follow-up',n,'').html)}
function readDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('A file could not be read.'));reader.readAsDataURL(file)})}
function loadImage(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('An image could not be processed.'));image.src=url})}
async function fileAttachment(file){let dataUrl;if(String(file.type||'').startsWith('image/')){const original=await readDataUrl(file);const image=await loadImage(original);const max=1100,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);dataUrl=canvas.toDataURL('image/jpeg',.68)}else{if(file.size>350*1024)throw new Error(`${file.name} is too large. Non-image files must be under 350 KB.`);dataUrl=await readDataUrl(file)}return{id:uid(),name:file.name,type:file.type||'application/octet-stream',size:file.size,dataUrl}}
async function collectAttachments(form){const input=form.querySelector('input[type="file"][name="attachments"]'),files=input?[...input.files]:[];if(files.length>3)throw new Error('Please choose no more than 3 attachments.');const items=[];for(const file of files)items.push(await fileAttachment(file));if(items.reduce((s,a)=>s+String(a.dataUrl||'').length,0)>1800000)throw new Error('These attachments are too large for browser storage. Please use smaller files.');return items}
async function handleForm(e){e.preventDefault();const form=e.currentTarget,type=form.dataset.formType,button=form.querySelector('[type="submit"]');button?.classList.add('form-saving');const before=JSON.stringify(state);try{const fd=new FormData(form),data={};for(const[k,v]of fd.entries())if(!(v instanceof File))data[k]=v;const categoryLibrary=data.__categoryLibrary,editId=data.__editId;delete data.__categoryLibrary;delete data.__editId;const newAttachments=await collectAttachments(form);if(categoryLibrary&&data.category)addCategory(categoryLibrary,data.category,false);if(type==='opening'){state.settings.openingBalance=Number(data.openingBalance||0)}else{const key={event:'events',task:'tasks',transaction:'transactions',project:'projects',client:'clients',quote:'quotes',recurring:'recurring',content:'content',goal:'goals',habit:'habits',reset:'resets',note:'notes',routine:'routines'}[type];if(!key)return;let existing=editId?state[key].find(x=>x.id===editId):null;data.id=existing?.id||uid();data.attachments=[...(Array.isArray(existing?.attachments)?existing.attachments:[]),...newAttachments];if(type==='task'){data.isTopPriority=String(data.isTopPriority)==='true'||form.querySelector('[name="isTopPriority"]')?.checked===true;data.priority=taskPriority(data);data.status=taskStatus(data);data.done=data.status==='completed';if(data.done)data.completedAt=existing?.completedAt||new Date().toISOString();else data.completedAt='';for(const k of ['estimatedMinutes'])if(data[k]!==undefined&&data[k]!=='')data[k]=Number(data[k])}const createTask=type==='note'&&form.querySelector('[name="createTask"]')?.checked===true;if(type==='note'){data.status=String(data.status||'pending').toLowerCase();if(createTask&&!existing?.linkedTaskId){const linked={id:uid(),title:`Follow up: ${data.title}`,description:data.nextAction||String(data.body||'').slice(0,300),date:data.followUpDate||data.date,time:data.followUpTime||'',priority:'medium',status:'pending',done:false,category:'Follow-up',relatedTo:data.relatedTo||'',isTopPriority:false,linkedNoteId:data.id,attachments:[]};state.tasks.push(linked);data.linkedTaskId=linked.id}else if(existing?.linkedTaskId){data.linkedTaskId=existing.linkedTaskId;const linked=state.tasks.find(t=>t.id===existing.linkedTaskId);if(linked&&!taskIsComplete(linked)){linked.title=`Follow up: ${data.title}`;linked.description=data.nextAction||String(data.body||'').slice(0,300);linked.date=data.followUpDate||data.date;linked.time=data.followUpTime||'';linked.relatedTo=data.relatedTo||''}}}for(const k of ['amount','progress','reach','engagement'])if(data[k]!==undefined&&data[k]!=='')data[k]=Number(data[k]);if(existing)Object.assign(existing,data);else state[key].push(data)}localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();showToast(editId?'Updated.':'Saved.');render()}catch(err){try{state=JSON.parse(before)}catch(e){}showToast(err?.message||'This record could not be saved.');button?.classList.remove('form-saving')}}
function openBackup(){openDrawer('Backup & restore','Your planner stays in this browser. Download a backup before replacing files or clearing browser data.',`<div class="action-menu-grid"><button class="menu-action" id="exportBackup"><span class="icon-box">${svg('download')}</span><span><strong>Download backup</strong><small>Save all planner data as a JSON file.</small></span><span>›</span></button><button class="menu-action" data-import><span class="icon-box">${svg('upload')}</span><span><strong>Restore backup</strong><small>Import a backup file from this planner.</small></span><span>›</span></button><input id="backupFile" type="file" accept="application/json" hidden><button class="menu-action" id="legacyImport"><span class="icon-box">${svg('repeat')}</span><span><strong>Try legacy import again</strong><small>Copy compatible records from the original planner storage.</small></span><span>›</span></button></div>`);document.getElementById('exportBackup').onclick=exportBackup;document.getElementById('legacyImport').onclick=()=>{state.migrated=false;migrateLegacy(state);state.migrated=true;localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();render();showToast('Legacy import completed.')}}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`life-ceo-os-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=JSON.parse(reader.result);if(!next||typeof next!=='object')throw new Error('Invalid');state=Object.assign(defaults(),next);normalizeCategoryLibraries(state);localStorage.setItem(STORE,JSON.stringify(state));closeDrawer();applyNav();render();showToast('Backup restored.')}catch(err){showToast('That backup file could not be read.')}};reader.readAsText(file)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
init();
})();
