<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jess's workspace for projects, daily admin and follow-ups.">
<title>Jess’s Workspace</title>
<style>
:root {
  color-scheme: light; --canvas:#f5f2ea; --paper:#fffdf8; --ink:#292e21; --muted:#625e51;
  --line:#e5dfd2; --olive:#39432b; --green:#e7ebdc; --burgundy:#703e4c;
  --rose:#f2e5e7; --gold:#f3e9d5; --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
* {box-sizing:border-box}
body {margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,textarea,select {font:inherit;color:inherit}
button {cursor:pointer}
button:disabled {cursor:default;opacity:.6}
a {color:#48573a;text-underline-offset:3px;overflow-wrap:anywhere}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {outline:2px solid #8a4d62;outline-offset:3px}
h1,h2,h3,p {margin:0}
h1,h2,h3 {overflow-wrap:anywhere}
h1,h2 {font:400 40px/1.08 var(--serif);letter-spacing:-.045em}
h2 {font-size:28px}
h3 {font-size:15px;line-height:1.35}
small,.muted {color:var(--muted)}
svg {display:inline-block;flex:none;vertical-align:middle}
[hidden] {display:none!important}
.shell {min-height:100vh;display:grid;grid-template-columns:219px minmax(0,1fr)}
aside {position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:27px 17px 19px;border-right:1px solid var(--line);background:#eeeade;gap:29px}
.brand {display:flex;gap:11px;align-items:center;text-align:left;background:none;border:0;padding:0 4px;color:var(--ink)}
.brand img {object-fit:cover;width:36px;height:39px;border-radius:19px 19px 4px 4px}
.brand strong {display:block;font:22px/1 var(--serif);letter-spacing:-.045em}
.brand small {font-size:11px}
.nav-label,.eyebrow {font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:760}
.nav-label {color:var(--muted);padding:0 10px 8px}
nav {display:grid;gap:3px}
.nav-button {width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:10px;border:0;border-radius:9px;background:none;color:#514e40;font-weight:590;white-space:nowrap}
.nav-button[aria-current=page] {background:#dce2ce;color:#313c24}
.nav-button:hover:not([aria-current]) {background:#e6e0d2}
.nav-count {margin-left:auto;background:var(--paper);border-radius:30px;padding:1px 7px;font-size:11px}
.aside-foot {margin-top:auto;display:grid;gap:8px}
.storage {display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;padding-left:9px}
.dot {display:inline-block;width:7px;height:7px;background:#64744d;border-radius:50%;flex:none}
.stage {min-width:0}
.topbar {background:#f5f2eaf2;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.top-inner {min-height:67px;max-width:1350px;margin:auto;padding:10px clamp(17px,3.35vw,48px);display:flex;align-items:center;gap:14px}
.search-trigger {display:flex;gap:8px;align-items:center;min-width:0;max-width:360px;flex:1;text-align:left}
.search-trigger span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-inner .spaces {margin-left:auto}
.spaces {display:flex;gap:2px;border-radius:9px;background:#ebe6da;padding:3px;flex:none}
.spaces button {background:none;border:0;padding:5px 10px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:650}
.spaces button[aria-pressed=true] {background:var(--paper);color:var(--ink);box-shadow:0 1px 4px #30281a12}
.btn {display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:650;white-space:nowrap;font-size:13px;min-height:36px}
.btn:hover {background:#f0ecdf}
.btn.primary {background:var(--olive);border-color:var(--olive);color:#fffdf5}
.btn.primary:hover {background:#4b573b}
.btn.quiet {background:none;border-color:transparent}
.btn.quiet:hover {background:#eee9dd}
.btn.icon {padding:7px;min-width:35px}
.btn.danger {color:#8a3848}
main {max-width:1350px;margin:auto;padding:24px clamp(17px,3.35vw,48px) 56px;display:grid;gap:22px}
.hero {min-height:208px;border-radius:17px;overflow:hidden;isolation:isolate;display:flex;align-items:center;position:relative;background:#38412c;color:#fffbed}

.hero::after {content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#39432d 0%,#39432d 38%,#39432d70 63%,#552f2014 100%)}
.hero-copy {padding:25px 32px;max-width:630px}
.hero h1 {font-size:clamp(42px,5vw,65px);margin:7px 0}
.hero .eyebrow,.hero p {color:#f1eddd}
.hero .btn {margin-top:17px;background:#f7f2e3;border-color:#f7f2e3}
.cards {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat {display:flex;align-items:center;gap:11px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat:hover {border-color:#a5aa90}
.tile-icon {height:36px;width:36px;flex:none;display:grid;place-items:center;background:var(--green);color:#45533a;border-radius:9px}
.tile-icon.rose {background:var(--rose);color:var(--burgundy)}
.tile-icon.gold {background:var(--gold);color:#745425}
.stat strong {font:26px/1 var(--serif);display:block}
.stat small {font-size:12px}
.stat .arrow {margin-left:auto;color:var(--muted)}
.columns {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.panel {background:var(--paper);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-head {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px}
.panel-head h2 {font-size:25px}
.panel-body {padding:0 18px 14px}
.row {display:flex;align-items:flex-start;gap:10px;min-width:0;padding:12px 0;border-top:1px solid var(--line)}
.row p,.row small {overflow-wrap:anywhere}
.row-main {flex:1;min-width:0}
.row-main .title {font-weight:700}
.row-main .title.link {background:none;padding:0;border:0;text-align:left;color:#34402b}
.row-main .title.link:hover {text-decoration:underline;text-underline-offset:3px}
.row-actions {display:flex;align-items:center;gap:3px;flex:none}
.entry .copy {white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.empty {padding:18px 0;color:var(--muted)}
.check {margin-top:3px;width:21px;height:21px;border:1px solid #b4b7a2;border-radius:6px;display:grid;place-items:center;background:#fffdf8;color:var(--olive);flex:none;padding:0}
.check.checked {background:var(--green);border-color:#9dab91}
.done .title {text-decoration:line-through;color:var(--muted)}
.badge {display:inline-block;font-size:11px;font-weight:700;color:#445039;background:var(--green);padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.rose {background:var(--rose);color:var(--burgundy)}
.badge.gold {background:var(--gold);color:#6d5029}
.badge.neutral {background:#eeeae0;color:#5b5548}
.heading {display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.heading h1 {font-size:clamp(40px,5vw,57px);margin:5px 0 8px}
.heading .meta {display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.record-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,228px),1fr));gap:13px}
.record {background:var(--paper);border:1px solid var(--line);border-radius:12px;text-align:left;padding:16px;display:grid;gap:9px;min-width:0}
.record:hover {border-color:#a5aa90}
.record h3 {font:23px/1.1 var(--serif);font-weight:400}
.record .meta {display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
progress {accent-color:#64774d;height:9px;width:100%}
.notes-form {display:grid;gap:8px;margin-bottom:15px}
textarea {resize:vertical;min-height:98px}
.notes-form .actions {display:flex;justify-content:space-between;align-items:center;gap:8px}
.field {display:grid;gap:5px;font-weight:650}
.field small {font-weight:400}
input,textarea,select {width:100%;border:1px solid #d8d1c1;border-radius:7px;background:#fffdf9;padding:8px 9px;font-weight:400;min-width:0}
.entry-img {display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin-top:8px}
.add-row {display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 13px}
.details-grid {display:grid;gap:9px}
details.panel {padding:0 18px}
details summary {padding:12px 0;cursor:pointer;font-weight:700}
dialog {width:min(500px,calc(100% - 28px));max-height:90dvh;border:1px solid var(--line);border-radius:15px;background:var(--paper);color:var(--ink);padding:0;box-shadow:0 20px 65px #29271e3d}
dialog::backdrop {background:#23251f75}
.dialog-head {padding:17px 20px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dialog-body {padding:0 20px 20px}
.dialog-body form {display:grid;gap:11px}
.form-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-actions {display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.form-actions .danger {margin-right:auto}
.feedback {margin:0;color:#84364c;min-height:1em;font-size:12px}
#toast {position:fixed;right:18px;bottom:18px;z-index:3;background:#343d2b;color:#fff8ed;padding:11px 15px;border-radius:9px;max-width:calc(100% - 36px);box-shadow:0 4px 14px #2223}
@media(max-width: 890px) {
  .shell {grid-template-columns:168px minmax(0,1fr)}
  aside {padding-inline:12px}
  .columns {grid-template-columns:1fr}
}
@media(max-width: 640px) {
  .shell {display:block}
  aside {height:auto;position:static;padding:12px 12px 7px;gap:9px;border-right:0;border-bottom:1px solid var(--line)}
  .brand img {width:27px;height:29px}
  .brand strong {font-size:20px}
  .brand small,.nav-label,.nav-count,.storage {display:none}
  .aside-foot {position:absolute;right:12px;top:7px}
  .aside-foot .nav-button {font-size:11px;padding:8px 5px}
  nav {grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
  .nav-button {font-size:12px;padding:6px;gap:5px;white-space:normal}
  .nav-button svg {width:14px;height:14px}
  .top-inner {min-height:54px;gap:6px;padding:7px 12px}
  .top-inner .spaces {margin-left:0}
  .spaces button {padding:4px 6px}
  .top-inner .btn {padding:6px 7px}
  input,textarea,select {font-size:16px}
  main {padding:14px 12px 30px;gap:13px}
  .hero {min-height:174px}
  .hero-copy {padding:18px}
  .hero::before {left:38%}
  .hero::after {background:linear-gradient(90deg,#39432d 0%,#39432d 39%,#39432d48 100%)}
  .cards {gap:5px}
  .stat {padding:6px;gap:5px}
  .stat .tile-icon {width:25px;height:28px}
  .stat .tile-icon svg {width:14px}
  .stat strong {font-size:23px}
  .stat small {font-size:10px;display:block}
  .stat .arrow {display:none}
  .panel-head,.panel-body,.add-row {padding-inline:13px}
}
</style>
</head>

    'Save to Inbox',item?btn('Delete','delete-capture',{id:item.id,style:'danger quiet'}):''),trigger);
}
function fileForm(trigger,item) {
  const targets = data.records.map(record=>[record.id,record.title+' · '+record.space]);
  if (!targets.length) {
    modal('File this capture','<p>Create a project, employee, or client record first.</p><div class="form-actions">'+btn('Close','close')+'</div>',trigger);
    return;
  }
  modal('File this capture',form('file',item.id,
    '<p class="muted" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(item.body)+'</p>'+
    select('Add to record','record',targets,data.records.find(record=>record.space===item.space)?.id)+
    select('Save as','kind',['Note','Reminder'],'Note')+
    '<div data-file-reminder hidden>'+field('Reminder title','title','',{attrs:'maxlength="160"'})+
    field('Follow-up date','due',day(),{type:'date'})+'</div>','File item'),trigger);
}
function recordForm(trigger,record) {
  const type = record?.type || view;
  const label = {Projects:'project',Employees:'employee',Clients:'client'}[type];
  const isProject = type==='Projects';
  const projectOptions = data.records.filter(record=>record.type==='Projects').map(item=>[item.id,item.title+' · '+item.space]);
  const fields = '<input name="type" type="hidden" value="'+type+'">'+
    field(isProject?'Project name':'Name','title',record?.title,{required:true,attrs:'maxlength="160"'})+
    select('Workspace','space',groups,record?.space||(space==='Personal'?'Personal':'R2R'))+
    (isProject?'<div class="form-grid">'+select('Status','status',statuses,record?.status||'Planning')+
      field('Progress (%)','progress',record?.progress??0,{type:'number',required:true,attrs:'min="0" max="100" step="1"'})+'</div>':
      field(type==='Employees'?'Role':'Company or role','role',record?.role,{attrs:'maxlength="160"'})+
      '<div class="form-grid">'+field('Email','email',record?.email,{type:'email',attrs:'maxlength="200"'})+
      field('Phone','phone',record?.phone,{type:'tel',attrs:'maxlength="60"'})+'</div>'+
      select('Related project','linkId',[['','None'],...projectOptions],record?.linkId||''))+
    area('Overview','summary',record?.summary);
  modal((record?'Edit ':'New ')+label,form('record',record?.id,fields,'Save '+label,
    record?btn('Delete','delete-record',{id:record.id,style:'danger quiet'}):''),trigger);
}
function adminForm(trigger,existing) {
  modal(existing?'Edit checklist item':'Add checklist item',form('admin',existing?.id,
    field('Checklist item','title',existing?.title,{required:true,attrs:'maxlength="160"'})+
    '<div class="form-grid">'+select('Repeats','repeat',['Daily','Weekly'],existing?.repeat||'Daily')+
    select('Workspace','space',groups,existing?.space||(space==='Personal'?'Personal':'R2R'))+'</div>',
    'Save checklist item',existing?btn('Delete','delete-admin',{id:existing.id,style:'danger quiet'}):''),trigger);
}
function entryForm(trigger,id,kind,existing) {
  const isNote = kind==='Note';
  const fields = '<input type="hidden" name="record" value="'+esc(id)+'"><input type="hidden" name="kind" value="'+esc(kind)+'">'+
    (isNote?'':field(kind==='Photo'?'Caption':'Title','title',existing?.title,{required:['Reminder','Update'].includes(kind),attrs:'maxlength="160"'}))+
    (kind==='Link'?field('Web link','url',existing?.url,{type:'url',required:true,attrs:'maxlength="3000"'}):'')+
    (kind==='Photo'?'<label class="field">'+(existing?'Replace photo':'Choose a photo')+
      '<input type="file" name="photo" accept="image/*" '+(existing?'':'required')+'><small>Photos are resized for browser storage.</small></label>':'')+
    (kind==='Reminder'?field('Follow-up date','due',existing?.due||day(),{type:'date',required:true}):'')+
    (kind==='Update'&&!existing&&rec(id).type==='Projects'?field('Progress now (%)','progress',rec(id).progress,{type:'number',required:true,attrs:'min="0" max="100" step="1"'}):'')+
    area(isNote?'Note':'Details','body',existing?.body,isNote)+
    select('From','source',sources,existing?.source||'Note');
  modal((existing?'Edit ':'Add ')+kind.toLowerCase(),form('entry',existing?.id,fields,'Save '+kind.toLowerCase(),
    existing?btn('Delete','delete-entry',{id:existing.id,style:'danger quiet'}):''),trigger);
}
function searchResults(value) {
  const query = value.trim().toLowerCase();
  const results = dialogBody.querySelector('#results');
  if (!query) { results.innerHTML=''; return; }
  const matches = (...text) => text.some(word=>typeof word==='string'&&word.toLowerCase().includes(query));
  const records = data.records.filter(item=>matches(item.title,item.summary,item.role,item.email,item.phone,item.space));
  const entries = data.entries.filter(item=>rec(item.record)&&matches(item.title,item.body,item.url,item.source));
  const inbox = data.inbox.filter(item=>matches(item.body,item.source));
  const checklist = data.admin.filter(item=>matches(item.title));
  results.innerHTML=[...records.map(record=>'<div class="row"><div class="row-main">'+openRecord(record.id,record.title)+'<br><small>'+esc(record.type+' · '+record.space)+'</small></div></div>'),
    ...entries.map(item=>'<div class="row"><div class="row-main">'+openRecord(item.record,rec(item.record).title)+'<p>'+esc((item.title||item.body||item.url||'').slice(0,155))+'</p></div></div>'),
    ...inbox.map(item=>'<div class="row"><div class="row-main"><small>'+esc(item.source+' · Inbox')+'</small><p>'+esc(item.body.slice(0,155))+'</p></div>'+btn('Open Inbox','search-view',{id:'Inbox',style:'quiet'})+'</div>'),
    ...checklist.map(item=>'<div class="row"><div class="row-main"><small>Admin</small><p>'+esc(item.title)+'</p></div>'+btn('Open Admin','search-view',{id:'Admin',style:'quiet'})+'</div>')].slice(0,40).join('')||empty('No matching notes, records, or checklist items.');
}
async function resizePhoto(file) {
  if (file.size>25*1024*1024) throw new Error('Choose a photo smaller than 25 MB.');
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const ratio = Math.min(1,1400/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
    const context=canvas.getContext('2d');
    context.fillStyle='#ffffff';
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.76);
  } catch {
    throw new Error('This photo couldn’t be opened. Try a JPG, PNG, or WebP image.');
  } finally { URL.revokeObjectURL(url); }
}
function writeItem(items,item) {
  const index = items.findIndex(old=>old.id===item.id);
  if (index<0) items.unshift(item);
  else items[index]=item;
}
async function submit(formElement,trigger) {
  if (!formElement?.reportValidity() || formElement.dataset.saving) return;
  const values = new FormData(formElement);
  const str = name => String(values.get(name)??'').trim();
  const kind = formElement.dataset.form;
  const id = formElement.dataset.id;
  const editingId = id || uid();
  const body = str('body');
  const title = str('title');
  let photo;
  const error = message => {
    if (dialog.open) dialogBody.querySelector('.feedback')?.replaceChildren(message);
    else note(message);
  };
  const blank = Array.from(formElement.querySelectorAll('input[type=text][required],textarea[required]')).some(input=>!input.value.trim());
  if (blank) { error('Fill in the required text before saving.'); return; }
  if (kind==='quick-note') {
    if (!rec(id)) { error('This record is no longer available. Copy your note before leaving.'); return; }
    const saved=save(d=>{
      d.entries.unshift({id:uid(),record:id,kind:'Note',source:'Note',body,created:day()});
      if (d.drafts?.notes) delete d.drafts.notes[id];
    },'Note saved.');
    if (saved) main.querySelector('.notes-form textarea')?.focus();
    return;
  }
  if (kind==='entry' && str('kind')==='Link' && !allowedLink(str('url'))) {
    error('Enter a link beginning with https:// or http://.');
    return;
  }
  if (kind==='entry' && values.get('photo')?.size) {
    formElement.dataset.saving='true';
    if (trigger) trigger.disabled=true;
    try { photo=await resizePhoto(values.get('photo')); }
    catch (e) { error(e.message); return; }
    finally {
      delete formElement.dataset.saving;
      if (trigger) trigger.disabled=false;
    }
    if (!dialog.open || !dialogBody.contains(formElement)) return;
  }
  if (kind==='file' && !rec(str('record'))) {
    error('Choose an available record.');
    return;
  }
  const saved = save(d=>{
    if (kind==='capture') {
      writeItem(d.inbox,{id:editingId,body,source:str('source'),space:str('space')});
      if (!id && d.drafts) delete d.drafts.capture;
    } else if (kind==='file') {
      const capture = byId(d.inbox,id);
      if (!capture) return;
      const reminder = str('kind')==='Reminder';
      d.entries.unshift({id:uid(),record:str('record'),kind:str('kind'),source:capture.source,body:capture.body,
        ...(reminder?{title,due:str('due')}:{}),created:day()});
      d.inbox=d.inbox.filter(item=>item.id!==id);
    } else if (kind==='record') {
      const type = str('type');
      const record = {id:editingId,type,title,space:str('space'),summary:str('summary')};
      if (type==='Projects') {
        record.status=str('status');
        record.progress=record.status==='Completed'?100:Number(str('progress'));
        if (record.progress===100) record.status='Completed';
      } else {
        Object.assign(record,{role:str('role'),email:str('email'),phone:str('phone'),linkId:str('linkId')});
      }
      writeItem(d.records,record);
    } else if (kind==='admin') {
      const previous=byId(d.admin,id);
      const repeat=str('repeat');
      writeItem(d.admin,{id:editingId,title,repeat,space:str('space'),checks:previous?.repeat===repeat?previous.checks:[]});
    } else if (kind==='entry') {
      const previous=byId(d.entries,id);
      const entry = {id:editingId,record:str('record'),kind:str('kind'),source:str('source'),title,body,
        url:str('url'),due:str('due'),photo:photo||previous?.photo,done:previous?.done&&previous.due===str('due'),created:previous?.created||day(),progress:previous?.progress};
      if (str('progress')!=='') {
        const project=byId(d.records,entry.record);
        if (!project) return;
        const progress=Number(str('progress'));
        if (progress===100) project.status='Completed';
        if (progress<100 && project.status==='Completed') project.status='In progress';
        project.progress=progress;
        entry.progress=progress;
      }
      writeItem(d.entries,entry);
    }
  },{capture:'Saved to Inbox.',file:'Filed in '+(rec(str('record'))?.title||'the record')+'.',record:'Record saved.',admin:'Checklist item saved.',entry:'Saved to record.'}[kind]);
  if (!saved) return;
  dialog.close();
  if (kind==='record') {
    if (!relevant(rec(editingId))) space='All';
    go(str('type'),editingId);
  }
}
function remove(type,id,trigger) {
  const message = type==='record'?'This removes the record and its notes, photos, and reminders.':'This removes the item from your workspace.';
  modal('Delete '+(type==='admin'?'checklist item':type)+'?',
    '<p>'+message+'</p><p class="feedback" role="alert"></p><div class="form-actions" style="margin-top:12px">'+
    btn('Cancel','close')+btn('Delete','confirm-'+type,{id,style:'danger'})+'</div>',trigger);
}
function confirmRemoval(type,id) {
  const collection = {record:'records',entry:'entries',admin:'admin',capture:'inbox'}[type];
  const saved=save(d=>{
    d[collection]=d[collection].filter(item=>item.id!==id);
    if (type==='record') {
      d.entries=d.entries.filter(item=>item.record!==id);
      if (d.drafts?.notes) delete d.drafts.notes[id];
      d.records.forEach(item=>{if (item.linkId===id) item.linkId='';});
    }
  },'Deleted.');
  if (saved) {
    dialog.close();
    if (type==='record'&&recordId===id) go(view);
  }
}
function settings(trigger) {
  pendingRestore=null;
  modal('Workspace settings','<p>'+esc(storageStatus)+'. Download a backup before switching versions or using another browser.</p>'+
    '<p class="feedback" role="alert"></p><div class="form-actions">'+
    (currentSamples()?btn('Remove sample data','remove-samples',{style:'danger quiet'}):'')+
    btn('Download backup','backup')+'</div>'+
    '<div style="margin-top:14px"><label class="field">Open a backup<input type="file" id="backup-file" accept=".json,application/json"><small>Choose whether to restore the full workspace or add missing items.</small></label></div>',trigger);
}
function exportBackup() {
  let backup;
  try { backup=latestData(); }
  catch {
    if (blockedStorage) {
      dialogBody.querySelector('.feedback')?.replaceChildren('Previous browser data could not be read. Open an earlier backup to recover it.');
      return;
    }
    backup=data;
  }
  const blob = new Blob([JSON.stringify({...backup,version:1},null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href=url;
  anchor.download='Jess-Workspace-backup.json';
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function previewRestore(imported,filename,trigger) {
  pendingRestore=imported;
  const counts=imported.records.length+' records, '+imported.entries.length+' entries, '+imported.inbox.length+' inbox items, and '+imported.admin.length+' admin items.';
  modal('Restore a backup','<p><strong>'+esc(filename)+'</strong><br>'+esc(counts)+'</p>'+
    '<p style="margin-top:10px">Restore replaces this copy with the backup, including checklist history, photos, and drafts. Download your current backup first if you want to keep it.</p>'+
    '<p class="feedback" role="alert"></p><div class="form-actions">'+
    btn('Download current backup','backup',{style:'quiet'})+
    btn('Add missing items','merge-backup')+
    btn('Restore workspace','restore-backup',{style:'primary'})+'</div>',trigger);
}
function applyBackup(merge) {
  if (!pendingRestore) return;
  const saved=merge ? save(d=>{
    for (const name of collections) {
      const positions=new Map(d[name].map((item,index)=>[item.id,index]));
      for (const item of pendingRestore[name]) {
        const existing=positions.get(item.id);
        if (existing===undefined) d[name].push(item);
        else if (d[name][existing].sample && !item.sample) d[name][existing]=item;
      }
    }
    const imported=pendingRestore.drafts;
    if (!imported) return;
    d.drafts ??= {};
    d.drafts.notes={...imported.notes,...d.drafts.notes};
    if (imported.capture && !d.drafts.capture?.body) d.drafts.capture=imported.capture;
  },'Backup items added.') : save(null,'Workspace restored.',{snapshot:pendingRestore});
  if (saved) {
    dialog.close();
    if (!merge) {
      space='All';
      go('Today');
    }
  }
}
main.addEventListener('input',event=>{
  const editor=event.target;
  if (!editor.matches('.notes-form textarea')) return;
  const id=editor.form.dataset.id;
  storeDraft(drafts=>{
    drafts.notes={...drafts.notes};
    if (editor.value) {
      drafts.notes={...drafts.notes,[id]:editor.value};
    } else delete drafts.notes[id];
  },editor.form.querySelector('[data-draft-status]'),editor.value?'Draft saved in this browser.':'Draft cleared.');
});
main.addEventListener('submit',event=>{event.preventDefault();submit(event.target);});
dialog.addEventListener('submit',event=>{event.preventDefault();submit(event.target,event.submitter);});
dialog.addEventListener('input',event=>{
  if (event.target.id==='query') searchResults(event.target.value);
  const form=event.target.form;
  if (form?.dataset.form==='capture' && !form.dataset.id) {
    const values=capsule(form.elements);
    storeDraft(drafts=>{
      if (values.body) drafts.capture=values;
      else delete drafts.capture;
    },form.querySelector('[data-draft-status]'),values.body?'Draft saved in this browser.':'Draft cleared.');
  }
});
dialog.addEventListener('change',async event=>{
  if (event.target.id==='backup-file') {
    const input = event.target;
    const file = input.files[0];
    if (!file) return;
    try {
      if (file.size>10*1024*1024) throw new Error('Backup is too large for this browser.');
      const imported=JSON.parse(await file.text());
      if (imported.version!==1 || !validData(imported)) throw new Error('Choose a valid Jess’s Workspace backup.');
      if (!dialog.open || !dialogBody.contains(input)) return;
      const {version,...snapshot}=imported;
      previewRestore(snapshot,file.name,input);
    } catch (err) {
      dialogBody.querySelector('.feedback')?.replaceChildren(err instanceof SyntaxError?'Choose a valid Jess’s Workspace backup.':err.message);
    } finally { input.value=''; }
    return;
  }
  if (event.target.form?.dataset.form==='file'&&event.target.name==='kind') {
    const show=event.target.value==='Reminder';
    const details=event.target.form.querySelector('[data-file-reminder]');
    details.hidden=!show;
    details.querySelectorAll('input').forEach(input=>{input.required=show;});
  }
});
dialog.addEventListener('close',()=>{
  pendingRestore=null;
  if (dialogReturn?.isConnected) dialogReturn.focus();
  else document.querySelector('[data-view="'+view+'"]')?.focus();
});
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if (!button) return;
  const {view:target,space:group,action,id,kind}=button.dataset;
  if (target) {go(target);return;}
  if (group) {
    space=group;
    if (recordId && !relevant(rec(recordId))) go(view);
    else render();
    document.querySelector('[data-space="'+group+'"]')?.focus();
    return;
  }
  if (action==='open-record') {
    const record=rec(id);
    if (!record) return;
    if (dialog.open) dialog.close();
    if (!relevant(record)) space='All';
    go(record.type,id);
  } else if (action==='due') document.querySelector('#followups')?.scrollIntoView({block:'center'});
  else if (action==='capture') captureForm(button);
  else if (action==='edit-capture') captureForm(button,byId(data.inbox,id));
  else if (action==='file') fileForm(button,byId(data.inbox,id));
  else if (action==='new-record') recordForm(button);
  else if (action==='edit-record') recordForm(button,rec(id));
  else if (action==='new-admin') adminForm(button);
  else if (action==='edit-admin') adminForm(button,byId(data.admin,id));
  else if (action==='new-entry') entryForm(button,id,kind);
  else if (action==='edit-entry') {
    const item=byId(data.entries,id);
    entryForm(button,item.record,item.kind,item);
  } else if (action==='submit') submit(button.form,button);
  else if (action==='close') dialog.close();
  else if (action==='toggle-admin') {
    const task=byId(data.admin,id);
    if (!task) return;
    const current=period(task);
    save(d=>{
      const item=byId(d.admin,id);
      item.checks=item.checks.includes(current)?item.checks.filter(value=>value!==current):[...item.checks,current];
    });
    document.querySelector('[data-action="toggle-admin"][data-id="'+CSS.escape(id)+'"]')?.focus();
  } else if (action==='toggle-reminder') {
    if (!byId(data.entries,id)) return;
    const done=!byId(data.entries,id).done;
    save(d=>{byId(d.entries,id).done=done;},done?'Follow-up completed.':'Follow-up reopened.');
    document.querySelector('[data-action="toggle-reminder"][data-id="'+CSS.escape(id)+'"]')?.focus();
  } else if (action==='search') {
    modal('Search workspace','<label class="field">Search all workspaces<input id="query" type="search" placeholder="Name, note, or project"></label><div id="results"></div>',button);
  } else if (action==='search-view') {
    space='All';
    dialog.close();
    go(id);
  } else if (action==='settings') settings(button);
  else if (action==='backup') exportBackup();
  else if (action==='restore-backup'||action==='merge-backup') applyBackup(action==='merge-backup');
  else if (action==='remove-samples') {
    modal('Remove sample data?','<p>Sample records with a new note, attachment, or draft will be kept.</p><p class="feedback" role="alert"></p><div class="form-actions">'+
      btn('Cancel','close')+btn('Remove samples','confirm-samples',{style:'danger'})+'</div>',button);
  } else if (action==='confirm-samples') {
    const saved=save(d=>{
      const inUse = new Set(d.entries.filter(item=>!item.sample).map(item=>item.record));
      d.records.filter(item=>!item.sample&&item.linkId).forEach(item=>inUse.add(item.linkId));
      Object.keys(d.drafts?.notes||{}).forEach(id=>inUse.add(id));
      d.records=d.records.filter(item=>!item.sample||inUse.has(item.id)).map(item=>({...item,sample:false}));
      ['entries','inbox','admin'].forEach(key=>{d[key]=d[key].filter(item=>!item.sample);});
    },'Sample data removed.');
    if (saved) dialog.close();
  } else if (action?.startsWith('delete-')) remove(action.slice(7),id,button);
  else if (action?.startsWith('confirm-')) confirmRemoval(action.slice(8),id);
});
document.addEventListener('keydown',event=>{
  if (event.key==='Enter'&&!event.isComposing&&event.target.matches('form input:not([type="file"]):not([type="date"]):not([type="number"])')) {
    event.preventDefault();
    submit(event.target.form);
  }
});
window.addEventListener('storage',event=>{
  if (event.key!==key || !event.newValue) return;
  try {
    const value=JSON.parse(event.newValue);
    if (!validData(value)) return;
    const draftOnly=collections.every(name=>JSON.stringify(value[name])===JSON.stringify(data[name]));
    data=value;
    if (!draftOnly) render();
  } catch {}
});
let lastDay=day();
setInterval(()=>{
  const now=day();
  if (now===lastDay) return;
  lastDay=now;
  render();
},30000);
document.querySelector('#settings-icon').innerHTML=icon('settings');
document.querySelector('#search-icon').innerHTML=icon('search');
document.querySelector('#plus-icon').innerHTML=icon('plus');
render();
</script>
